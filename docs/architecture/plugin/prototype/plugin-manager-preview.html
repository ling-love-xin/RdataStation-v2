<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RdataStation · 插件管理面板预览（驱动登记感知）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E8846F'/%3E%3Cpath d='M9 24V8h8a5 5 0 0 1 0 10H13v6' stroke='%23181818' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<!--
  插件管理页 · 独立预览（驱动 / 权限 / 登记状态 / 文件入口感知版）
  这是评审用的形态稿，不是产品代码。数据为 2026-11-10 仓库内三个侧车插件的真实清单字段，
  卡片与详情栏已同步「运行形态 / 贡献点 / 驱动（含 global.db 登记状态）/ 权限」四类明细，
  详情栏另有「目录 / 日志」入口（打开 plugins/<id> 与 plugin-cache/<id>/sidecar.log），
  便于先看效果再对齐 GPUI 实现。
  双击即可打开，不依赖网络与构建。
-->
<style>
  :root[data-theme="dark"] {
    --bg:#1F1F1F; --chrome:#181818; --panel:#252526; --card:#202020; --card-hover:#232323;
    --border:#3C3C3C; --border-soft:#2B2B2B; --text:#CCCCCC; --strong:#FFFFFF;
    --muted:#8A8A8A; --muted-2:#696969; --brand:#E8846F; --brand-soft:rgba(232,132,111,.13);
    --brand-line:rgba(232,132,111,.42); --ok:#89D185; --ok-soft:rgba(137,209,133,.13);
    --warn:#E3B341; --warn-soft:rgba(227,179,65,.13); --danger:#F14C4C; --danger-soft:rgba(241,76,76,.13);
    --info:#75BEFF; --info-soft:rgba(117,190,255,.13); --input:#2A2A2A; --activity:#333333;
    --slot:#252526; --shadow:0 18px 50px rgba(0,0,0,.38); --overlay:rgba(0,0,0,.55);
  }
  :root[data-theme="light"] {
    --bg:#FFFFFF; --chrome:#F8F8F8; --panel:#F3F3F3; --card:#FAFAFA; --card-hover:#F5F5F5;
    --border:#D4D4D4; --border-soft:#E7E7E7; --text:#333333; --strong:#111111;
    --muted:#6E6E6E; --muted-2:#8A8A8A; --brand:#BC5340; --brand-soft:rgba(188,83,64,.10);
    --brand-line:rgba(188,83,64,.36); --ok:#15803D; --ok-soft:rgba(21,128,61,.10);
    --warn:#A16207; --warn-soft:rgba(161,98,7,.10); --danger:#B91C1C; --danger-soft:rgba(185,28,28,.10);
    --info:#1D4ED8; --info-soft:rgba(29,78,216,.10); --input:#FFFFFF; --activity:#ECECEC;
    --slot:#F3F3F3; --shadow:0 18px 50px rgba(0,0,0,.14); --overlay:rgba(0,0,0,.32);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--activity); color: var(--text);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .app { height: 100%; display: flex; flex-direction: column; background: var(--bg); min-height: 640px; }
  .title-bar {
    height: 36px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: var(--chrome); border-bottom: 1px solid var(--border-soft);
  }
  .logo {
    width: 20px; height: 20px; border-radius: 6px; background: var(--brand); color: #181818;
    display: grid; place-items: center; font-weight: 700; font-size: 12px;
  }
  .project-slot { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--slot); border-radius: 4px; font-size: 12px; }
  .project-slot span { color: var(--muted); }
  .project-slot b { font-weight: 500; color: var(--text); }
  .quick-open { margin: 0 auto; width: min(320px, 34vw); height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-size: 12px; }
  .kbd { font-size: 11px; color: var(--muted-2); }
  .win-controls { display: flex; gap: 2px; color: var(--muted); }
  .win-controls i { font-style: normal; width: 26px; text-align: center; }

  .workspace { flex: 1; min-height: 0; display: flex; }
  .activity-bar { width: 48px; flex: none; background: var(--activity); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; border-right: 1px solid var(--border-soft); }
  .activity-btn { width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .activity-btn svg { width: 22px; height: 22px; }
  .activity-btn:hover { background: var(--card-hover); color: var(--text); }
  .activity-btn.active { color: var(--strong); box-shadow: inset 2px 0 0 var(--brand); background: var(--card); }
  .activity-spacer { flex: 1; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .page-head {
    flex: none; display: flex; align-items: flex-start; gap: 16px; padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .page-title { min-width: 0; flex: 1; }
  .page-title h1 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 600; color: var(--strong); }
  .page-title p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    height: 28px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  }
  .btn:hover { background: var(--card-hover); color: var(--strong); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #181818; font-weight: 600; }
  .btn.primary:hover { background: var(--brand-strong, var(--brand)); }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 14px; height: 14px; }

  .driver-chain {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    border-bottom: 1px solid var(--border-soft); background: var(--chrome); overflow-x: auto;
  }
  .chain-label { flex: none; font-size: 11px; color: var(--muted); }
  .chain-step { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; color: var(--text); white-space: nowrap; }
  .chain-step i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .chain-step.warn i { background: var(--warn); }
  .chain-step.bad i { background: var(--danger); }
  .chain-step .muted { color: var(--muted); }
  .chain-note { flex: none; font-size: 11px; color: var(--warn); }
  .chain-arrow { flex: none; color: var(--muted-2); font-size: 11px; }

  .stats { flex: none; display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; }
  .stat { min-width: 104px; padding: 8px 10px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--card); display: flex; align-items: baseline; gap: 8px; }
  .stat b { font-size: 18px; color: var(--strong); font-weight: 600; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat.ok b { color: var(--ok); }
  .stat.warn b { color: var(--warn); }
  .stat.err b { color: var(--danger); }

  .notice { display: none; margin: 12px 16px 0; padding: 8px 10px; border: 1px solid var(--brand-line); background: var(--brand-soft); border-radius: 4px; font-size: 12px; color: var(--text); }
  .notice.show { display: block; }

  .toolbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
  .search { height: 28px; width: 240px; max-width: 100%; border: 1px solid var(--border); border-radius: 4px; background: var(--input); color: var(--text); padding: 0 8px; outline: none; }
  .search:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand-line); }
  .segments { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg { height: 26px; padding: 0 10px; border: 0; border-right: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; }
  .seg:last-child { border-right: 0; }
  .seg:hover { background: var(--card-hover); color: var(--text); }
  .seg.on { background: var(--brand-soft); color: var(--brand); }
  .toolbar-right { margin-left: auto; font-size: 11px; color: var(--muted); }

  .body-row { flex: 1; min-height: 0; display: flex; }
  .list-wrap { flex: 1; min-width: 0; overflow: auto; padding: 0 16px 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card {
    min-height: 168px; padding: 12px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--card); display: flex; flex-direction: column; gap: 8px; text-align: left;
    color: var(--text); cursor: pointer;
  }
  .card:hover { background: var(--card-hover); }
  .card.on { border-color: var(--brand); }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-name { flex: 1; min-width: 0; }
  .card-name strong { display: block; font-size: 13px; color: var(--strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-name small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { flex: none; font-size: 11px; }
  .state.active { color: var(--ok); }
  .state.inactive { color: var(--muted); }
  .state.error { color: var(--danger); }
  .desc { margin: 0; font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; color: var(--text); background: var(--panel); }
  .chip.driver { border-color: var(--brand-line); color: var(--brand); background: var(--brand-soft); }
  .chip.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .actions { margin-top: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  .mini { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); font-size: 11px; }
  .mini:hover { background: var(--card-hover); }
  .mini.danger:hover { border-color: var(--danger); color: var(--danger); }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); font-size: 12px; }

  .detail { width: 340px; flex: none; border-left: 1px solid var(--border); overflow: auto; }
  .detail-empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); font-size: 12px; }
  .d-head { padding: 16px; border-bottom: 1px solid var(--border-soft); }
  .d-head h2 { margin: 0; font-size: 14px; color: var(--strong); font-weight: 600; word-break: break-word; }
  .d-head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); word-break: break-all; }
  .d-section { padding: 16px; border-bottom: 1px solid var(--border-soft); }
  .d-section h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; color: var(--strong); }
  .kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 8px; font-size: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--text); word-break: break-all; }
  .driver-item { padding: 8px 10px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--panel); }
  .driver-item + .driver-item { margin-top: 8px; }
  .driver-item b { font-size: 12px; color: var(--strong); font-weight: 600; }
  .driver-item span { margin-left: 6px; font-size: 11px; color: var(--brand); }
  .reg-badge { padding: 1px 6px; border: 1px solid; border-radius: 3px; font-size: 10px; line-height: 1.6; }
  .reg-badge.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .reg-badge.off { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .driver-item p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  .hint { margin-top: 8px; font-size: 11px; color: var(--muted); }
  .perm-group { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; align-items: start; margin-top: 8px; }
  .perm-group > span { font-size: 11px; color: var(--muted); padding-top: 3px; }
  .warn-line { margin: 8px 0 0; font-size: 11px; color: var(--danger); }
  .contrib-item { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
  .contrib-item:last-child { border-bottom: 0; }
  .contrib-item b { font-size: 12px; color: var(--strong); font-weight: 500; }
  .contrib-item small { flex-basis: 100%; font-size: 11px; color: var(--muted); }
  .run-state { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .dot-state { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .error-box { margin-top: 8px; padding: 8px; border: 1px solid rgba(241,76,76,.35); background: var(--danger-soft); color: var(--danger); border-radius: 4px; font-size: 11px; }

  .status-bar { height: 24px; flex: none; display: flex; align-items: center; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--border-soft); color: var(--muted); font-size: 11px; gap: 12px; }
  .status-bar span:last-child { margin-left: auto; }

  .proto-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; background: var(--chrome); border-bottom: 1px solid var(--border-soft); font-size: 11px; color: var(--muted); }
  .proto-bar b { color: var(--text); font-weight: 500; }
  #theme-toggle { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text); font-size: 11px; }

  dialog { width: min(520px, 92vw); padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: var(--overlay); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .dlg-head h3 { margin: 0; flex: 1; font-size: 14px; color: var(--strong); }
  .dlg-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .field label { display: block; margin-bottom: 4px; font-size: 11px; color: var(--muted); }
  .field select, .field input { width: 100%; height: 30px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); color: var(--text); padding: 0 8px; }
  .dlg-note { font-size: 11px; color: var(--muted); }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-soft); }

  @media (max-width: 1080px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .detail { display: none; }
    .activity-bar { display: none; }
    .quick-open { display: none; }
  }
  @media (max-width: 640px) {
    .page-head { flex-direction: column; }
    .head-actions { justify-content: flex-start; }
    .search { width: 100%; }
    .stats .stat { flex: 1 1 44%; min-width: 0; }
  }
</style>
</head>
<body>
<div class="proto-bar">
  <div><b>RdataStation · 插件管理面板预览</b> · 驱动感知版</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span>2026-11-10 · 形态稿，不是产品代码</span>
    <button id="theme-toggle" type="button">☀ 亮色</button>
  </div>
</div>

<div class="app">
  <header class="title-bar">
    <div class="logo">R</div>
    <div class="project-slot"><span>项目</span><b>销售分析</b></div>
    <div class="quick-open"><span>搜索文件、表或命令</span><span class="kbd">Ctrl P</span></div>
    <div class="win-controls" aria-hidden="true"><i>─</i><i>□</i><i>✕</i></div>
  </header>

  <div class="workspace">
    <nav class="activity-bar" aria-label="活动栏">
      <button class="activity-btn" type="button" title="草稿箱" data-toast="草稿箱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
      </button>
      <button class="activity-btn" type="button" title="数据库导航" data-toast="数据库导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
      </button>
      <button class="activity-btn" type="button" title="资源分析" data-toast="资源分析">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5M12 16V7M16 16v-8"/></svg>
      </button>
      <button class="activity-btn active" type="button" title="插件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4v3M16 4v3"/><path d="M6 7h12v5a6 6 0 0 1-12 0z"/><path d="M12 12v6"/><path d="M9 18h6"/></svg>
      </button>
      <div class="activity-spacer"></div>
      <button class="activity-btn" type="button" title="设置" data-toast="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </button>
    </nav>

    <div class="main">
      <div class="page-head">
        <div class="page-title">
          <h1>插件管理</h1>
          <p>本地已安装 · 所有操作立即生效 · 驱动随插件启用登记到连接对话框</p>
        </div>
        <div class="head-actions">
          <button class="btn primary" type="button" id="install">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            安装插件
          </button>
          <button class="btn" type="button" id="import-dir">从目录导入</button>
          <button class="btn ghost" type="button" id="refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 5v6h-6"/></svg>
            刷新
          </button>
        </div>
      </div>

      <div class="driver-chain" id="driver-chain" aria-label="驱动链路"></div>

      <div class="stats" id="stats"></div>
      <div class="notice" id="notice"></div>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="搜索插件名、ID、驱动…" aria-label="搜索插件">
        <div class="segments" id="segments">
          <button class="seg on" type="button" data-filter="all">全部</button>
          <button class="seg" type="button" data-filter="active">已启用</button>
          <button class="seg" type="button" data-filter="inactive">已停用</button>
          <button class="seg" type="button" data-filter="error">出错</button>
        </div>
        <div class="toolbar-right" id="count">共 3 个</div>
      </div>

      <div class="body-row">
        <div class="list-wrap"><div class="grid" id="grid"></div></div>
        <aside class="detail" id="detail"></aside>
      </div>

      <div class="status-bar">
        <span>连接：本地</span><span>语言服务：就绪</span><span id="driver-count">驱动：2 个已登记</span>
      </div>
    </div>
  </div>
</div>

<dialog id="conn-dialog">
  <div class="dlg-head">
    <h3>新建数据源连接</h3>
    <button class="mini" type="button" id="close-conn">关闭</button>
  </div>
  <div class="dlg-body">
    <div class="field">
      <label for="driver-select">驱动</label>
      <select id="driver-select">
        <option>Oracle Database (Rust) · oracle</option>
        <option>SQL Server (Rust) · mssql</option>
        <option>PostgreSQL · postgresql</option>
      </select>
    </div>
    <div class="field"><label for="host">主机</label><input id="host" value="192.168.3.138"></div>
    <div class="field"><label for="port">端口</label><input id="port" value="1521"></div>
    <p class="dlg-note">插件驱动已进入下拉；此处只演示表单形态，不会真的连接。</p>
  </div>
  <div class="dlg-foot">
    <button class="btn" type="button" id="cancel-conn">取消</button>
    <button class="btn primary" type="button" id="test-conn">测试连接</button>
  </div>
</dialog>

<input id="dir-input" type="file" webkitdirectory multiple hidden>

<script>
const PLUGINS = [
  {
    id: "rds.driver.oracle-rust",
    name: "Oracle Native Driver (Rust)",
    version: "0.1.0",
    kind: "sidecar",
    state: "active",
    description: "Oracle 数据库原生 Rust 驱动（纯 Rust TNS 实现，无 JVM / OCI 依赖）",
    author: "rds",
    entry: "bin/agent",
    dir: "plugins/rds.driver.oracle-rust",
    hasLog: true,
    dependencies: [],
    dependents: [],
    runtime: "原生 rust",
    permissions: { process: ["spawn.child_process", "net.connect", "fs.read_plugin_data"], driver: ["driver.query", "driver.metadata", "driver.transaction"], credentials: "database" },
    items: [],
    contributions: "驱动 1",
    drivers: [{ id: "oracle", name: "Oracle Database (Rust)", port: 1521, category: "relational", features: ["schemas", "transactions"], registered: true }]
  },
  {
    id: "rds.driver.mssql-rust",
    name: "SQL Server Native Driver (Rust)",
    version: "0.1.0",
    kind: "sidecar",
    state: "active",
    description: "SQL Server 原生 Rust 驱动（TDS 协议直连，无 JVM / ODBC 依赖）",
    author: "rds",
    entry: "bin/agent",
    dir: "plugins/rds.driver.mssql-rust",
    hasLog: true,
    dependencies: [],
    dependents: [],
    runtime: "原生 rust",
    permissions: { process: ["spawn.child_process", "net.connect", "fs.read_plugin_data"], driver: ["driver.query", "driver.metadata", "driver.transaction"], credentials: "database" },
    items: [],
    contributions: "驱动 1",
    drivers: [{ id: "mssql", name: "SQL Server (Rust)", port: 1433, category: "relational", features: ["schemas", "transactions"], registered: true }]
  },
  {
    id: "rds.driver.postgres-py",
    name: "PostgreSQL Driver (Python)",
    version: "0.1.0",
    kind: "sidecar",
    state: "inactive",
    description: "PostgreSQL DB-API 2.0 驱动插件（Python 通用壳 + psycopg）",
    author: "rds",
    entry: "rds_dbapi_shell.py",
    dir: "plugins/rds.driver.postgres-py",
    hasLog: false,
    dependencies: [],
    dependents: null,
    runtime: "python 解释器",
    permissions: { process: ["spawn.child_process", "net.connect", "fs.read_plugin_data"], driver: ["driver.query", "driver.metadata", "driver.transaction", "driver.cancel"], credentials: "database" },
    items: [],
    contributions: "驱动 1",
    drivers: [{ id: "postgresql", name: "PostgreSQL", port: 5432, category: "relational", features: ["transactions", "cancel"], registered: false }]
  }
];

const state = { filter: "all", query: "", selected: "rds.driver.oracle-rust", busy: false, notice: "" };
const $ = (id) => document.getElementById(id);
const stateLabel = { active: "已启用", inactive: "已停用", error: "出错" };
const kindLabel = { sidecar: "侧车插件", wasm: "沙箱插件", frontend: "扩展宿主", unknown: "未知形态" };

function filtered() {
  const q = state.query.trim().toLowerCase();
  return PLUGINS.filter((p) => {
    const byFilter = state.filter === "all" || p.state === state.filter;
    const hit = !q || [p.name, p.id, p.description, p.drivers.map((d) => d.id + " " + d.name).join(" ")]
      .join(" ").toLowerCase().includes(q);
    return byFilter && hit;
  });
}

function stats() {
  const all = PLUGINS.length;
  const active = PLUGINS.filter((p) => p.state === "active").length;
  const inactive = PLUGINS.filter((p) => p.state === "inactive").length;
  const error = PLUGINS.filter((p) => p.state === "error").length;
  $("stats").innerHTML = [
    `<div class="stat"><b>${all}</b><span>全部</span></div>`,
    `<div class="stat ok"><b>${active}</b><span>已启用</span></div>`,
    `<div class="stat warn"><b>${inactive}</b><span>已停用</span></div>`,
    `<div class="stat err"><b>${error}</b><span>出错</span></div>`
  ].join("");
}

function driverChips(p) {
  if (!p.drivers.length) return "";
  return `<div class="chips">${p.drivers.map((d) => `<span class="chip driver">驱动 · ${esc(d.name)}</span>`).join("")}</div>`;
}

function card(p) {
  return `
  <article class="card ${p.id === state.selected ? "on" : ""}" data-select="${esc(p.id)}" tabindex="0" role="button" aria-label="查看 ${esc(p.name)} 详情">
    <div class="card-top">
      <div class="card-name"><strong>${esc(p.name)}</strong><small>${esc(p.id)} · v${esc(p.version)}</small></div>
      <span class="state ${p.state}">${stateLabel[p.state]}</span>
    </div>
    <p class="desc">${esc(p.description)}</p>
    ${driverChips(p)}
    <div class="meta"><span>${kindLabel[p.kind]}</span><span>·</span><span>${esc(p.runtime || "—")}</span><span>·</span><span>${esc(p.contributions)}</span><span>·</span><span>${p.drivers.length ? p.drivers.length + " 个驱动" : "无驱动"}</span></div>
    <div class="actions">
      <button class="mini" type="button" data-detail="${esc(p.id)}">详情</button>
      <button class="mini" type="button" data-toggle="${esc(p.id)}">${p.state === "active" ? "停用" : "启用"}</button>
      ${p.state === "error" ? `<button class="mini" type="button" data-retry="${esc(p.id)}">重试</button>` : ""}
    </div>
  </article>`;
}

function renderGrid() {
  const list = filtered();
  $("grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">没有匹配的插件。清空搜索或切回「全部」。</div>`;
  $("count").textContent = `共 ${list.length} 个`;
  document.querySelectorAll("[data-select]").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-detail],[data-toggle],[data-retry]")) return;
      state.selected = el.dataset.select;
      renderAll();
    });
  });
}

function detail(p) {
  if (!p) return `<div class="detail-empty">选择左侧卡片查看详情</div>`;
  const drivers = p.drivers.length
    ? p.drivers.map((d) => `
      <div class="driver-item">
        <b>${esc(d.name)}</b><span>${esc(d.id)}</span>
        <span class="reg-badge ${d.registered ? "ok" : "off"}">${d.registered ? "已登记" : "未登记"}</span>
        <p>默认端口 ${d.port} · 分类 ${esc(d.category)} · ${d.features.map(esc).join(" / ")}</p>
      </div>`).join("")
    : `<div class="hint">此插件没有声明数据库驱动。</div>`;
  const perm = p.permissions || {};
  const permGroups = [
    ["进程", perm.process],
    ["数据面", perm.driver]
  ].filter(([, values]) => values && values.length);
  const permHtml = permGroups.length || perm.credentials
    ? `${permGroups.map(([label, values]) => `<div class="perm-group"><span>${label}</span><div class="chips">${values.map((v) => `<span class="chip">${esc(v)}</span>`).join("")}</div></div>`).join("")}
       ${perm.credentials === "database" ? `<p class="warn-line">会接收数据库密码（仅用于建立连接）。</p>` : ""}`
    : `<div class="hint">清单未声明权限。</div>`;
  const dependsOn = (p.dependencies || []).length
    ? `<div class="chips">${p.dependencies.map((d) => `<span class="chip">${esc(d)}</span>`).join("")}</div>`
    : `<p class="hint">未声明依赖。</p>`;
  const dependents = p.dependents === null
    ? `<p class="hint">未查询（全局库未初始化，卸载前仍会实时检查）。</p>`
    : p.dependents.length
      ? `<div class="chips">${p.dependents.map((d) => `<span class="chip warn">${esc(d)}</span>`).join("")}</div><p class="hint">卸载前需先卸载依赖它的插件。</p>`
      : `<p class="hint">没有其他插件依赖它。</p>`;
  const items = (p.items || []).length
    ? p.items.map((item) => `<div class="contrib-item"><span class="chip">${esc(item.kind)}</span><b>${esc(item.label)}</b><small>${esc(item.id)}${item.detail ? " · " + esc(item.detail) : ""}</small></div>`).join("")
    : `<div class="hint">清单未声明命令 / 面板 / 设置；驱动见上一段。</div>`;
  return `
    <div class="d-head"><h2>${esc(p.name)}</h2><p>${esc(p.id)} · v${esc(p.version)}</p></div>
    <div class="d-section">
      <h3>基本信息</h3>
      <dl class="kv">
        <dt>插件 ID</dt><dd>${esc(p.id)}</dd>
        <dt>名称</dt><dd>${esc(p.name)}</dd>
        <dt>版本</dt><dd>${esc(p.version)}</dd>
        <dt>类型</dt><dd>${kindLabel[p.kind]}</dd>
        <dt>运行形态</dt><dd>${esc(p.runtime || "—")}</dd>
        <dt>作者</dt><dd>${esc(p.author)}</dd>
        <dt>入口</dt><dd>${esc(p.entry)}</dd>
      </dl>
    </div>
    <div class="d-section">
      <h3>贡献点</h3>
      ${items}
    </div>
    <div class="d-section">
      <h3>驱动</h3>
      ${drivers}
      <p class="hint">${p.state === "active" ? "插件已启用：驱动会出现在新建连接的驱动下拉。" : "插件未启用：驱动行会置灰或从下拉移除。"}</p>
    </div>
    <div class="d-section">
      <h3>依赖关系</h3>
      <p class="hint">本插件依赖：</p>
      ${dependsOn}
      <p class="hint">被其他插件依赖：</p>
      ${dependents}
    </div>
    <div class="d-section">
      <h3>权限</h3>
      ${permHtml}
    </div>
    <div class="d-section">
      <h3>运行状态</h3>
      <div class="run-state"><span class="dot-state" style="background:${p.state === "active" ? "var(--ok)" : p.state === "error" ? "var(--danger)" : "var(--muted)"}"></span>${stateLabel[p.state]}</div>
      ${p.state === "error" ? `<div class="error-box">加载失败：清单缺少入口字段</div>` : ""}
      <p class="hint">原生 Rust 插件不解析解释器；Java / Python 插件按 runtime 解析。</p>
    </div>
    <div class="d-section">
      <h3>管理动作</h3>
      <div class="actions">
        <button class="mini" type="button" data-toggle="${esc(p.id)}">${p.state === "active" ? "停用" : "启用"}</button>
        <button class="mini" type="button" data-retry="${esc(p.id)}">重试加载</button>
        <button class="mini" type="button" data-open-dir="${esc(p.id)}">目录</button>
        <button class="mini" type="button" data-open-log="${esc(p.id)}" ${p.hasLog ? "" : "disabled"} title="${p.hasLog ? "用默认应用打开 sidecar.log" : "还没有 sidecar 日志（驱动未启动过）"}">日志</button>
        <button class="mini" type="button" data-copy-diag="${esc(p.id)}" title="复制插件状态、驱动登记与日志路径">复制诊断</button>
        <button class="mini danger" type="button" data-uninstall="${esc(p.id)}" ${(p.dependents || []).length ? "disabled" : ""} title="${(p.dependents || []).length ? "被 " + p.dependents.join("、") + " 依赖，需先卸载它们" : "从磁盘删除插件目录（保留 plugin-data）"}">卸载</button>
      </div>
      <p class="hint">目录对应 <code>plugins/${esc(p.id)}</code>；日志对应 <code>plugin-cache/${esc(p.id)}/sidecar.log</code>。卸载会从磁盘删除插件目录，但保留 plugin-data 下的用户数据。</p>
    </div>`;
}

function renderDetail() {
  const p = PLUGINS.find((x) => x.id === state.selected);
  $("detail").innerHTML = detail(p);
}

function renderNotice() {
  const el = $("notice");
  el.classList.toggle("show", Boolean(state.notice));
  el.textContent = state.notice;
}

function renderDriverChain() {
  const declared = PLUGINS.reduce((n, p) => n + p.drivers.length, 0);
  const active = PLUGINS.filter((p) => p.state === "active").reduce((n, p) => n + p.drivers.length, 0);
  const registered = PLUGINS.reduce((n, p) => n + p.drivers.filter((d) => d.registered).length, 0);
  const steps = [
    { label: "清单声明", detail: `${declared} 个驱动`, tone: declared ? "ok" : "bad" },
    { label: "插件启用", detail: `${active} 个驱动在启用插件内`, tone: active ? "ok" : "bad" },
    { label: "写入 drivers 表", detail: `${registered} 行可用`, tone: registered ? "ok" : "bad" },
    { label: "连接下拉", detail: registered ? `${registered} 个驱动可选` : "下拉为空", tone: registered ? "ok" : "bad" }
  ];
  let note = "";
  if (!declared) note = "卡在：没有任何插件声明驱动。";
  else if (!active) note = "卡在：声明了驱动的插件都未启用。";
  else if (!registered) note = "卡在：驱动行没有写入 global.db。";
  else if (registered < declared) note = `注意：${declared - registered} 个驱动未登记（通常来自未启用的插件）。`;
  const html = [`<span class="chain-label">驱动链路</span>`]
    .concat(steps.map((s, i) => `${i ? '<span class="chain-arrow">→</span>' : ""}<span class="chain-step ${s.tone}"><i></i>${s.label}<span class="muted">${s.detail}</span></span>`))
    .concat(note ? [`<span class="chain-note">${note}</span>`] : [])
    .join("");
  $("driver-chain").innerHTML = html;
}

function renderAll() {
  stats();
  renderDriverChain();
  renderGrid();
  renderDetail();
  renderNotice();
  const declaredDrivers = PLUGINS.reduce((n, p) => n + p.drivers.length, 0);
  const registeredDrivers = PLUGINS.reduce((n, p) => n + p.drivers.filter((d) => d.registered).length, 0);
  $("driver-count").textContent = declaredDrivers
    ? `驱动：${registeredDrivers}/${declaredDrivers} 已登记`
    : "驱动：0";
  bindRowActions();
}

function bindRowActions() {
  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = PLUGINS.find((x) => x.id === el.dataset.toggle);
      p.state = p.state === "active" ? "inactive" : "active";
      state.notice = p.state === "active"
        ? `已启用「${p.name}」，驱动 ${p.drivers.map((d) => d.id).join(" / ") || "无"} 重新登记`
        : `已停用「${p.name}」，对应驱动行已置灰`;
      renderAll();
    });
  });
  document.querySelectorAll("[data-retry]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = PLUGINS.find((x) => x.id === el.dataset.retry);
      p.state = "active";
      state.notice = `已重新加载「${p.name}」`;
      renderAll();
    });
  });
  document.querySelectorAll("[data-open-dir]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = PLUGINS.find((x) => x.id === el.dataset.openDir);
      state.notice = `预览：实际实现会在文件管理器打开 ${p.dir}`;
      renderAll();
    });
  });
  document.querySelectorAll("[data-open-log]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = PLUGINS.find((x) => x.id === el.dataset.openLog);
      state.notice = `预览：实际实现会用默认应用打开 plugin-cache/${p.id}/sidecar.log`;
      renderAll();
    });
  });
  document.querySelectorAll("[data-copy-diag]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = PLUGINS.find((x) => x.id === el.dataset.copyDiag);
      const drivers = p.drivers.map((d) => `${d.id}=${d.registered ? "已登记" : "未登记"}`).join(" / ") || "未声明";
      state.notice = `预览：实际实现会把诊断复制到剪贴板（${p.id} · ${p.state} · 驱动 ${drivers} · ${p.dir}）`;
      renderAll();
    });
  });
  document.querySelectorAll("[data-uninstall]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = PLUGINS.find((x) => x.id === el.dataset.uninstall);
      state.notice = `演示：卸载「${p.name}」会弹确认框；此稿不执行删除`;
      renderNotice();
    });
  });
  document.querySelectorAll("[data-detail]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      state.selected = el.dataset.detail;
      renderAll();
    });
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.querySelectorAll(".seg").forEach((el) => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".seg").forEach((x) => x.classList.remove("on"));
    el.classList.add("on");
    state.filter = el.dataset.filter;
    renderGrid();
    bindRowActions();
  });
});

$("search").addEventListener("input", (e) => {
  state.query = e.target.value;
  renderGrid();
  bindRowActions();
});

$("refresh").addEventListener("click", () => {
  if (state.busy) return;
  state.busy = true;
  $("refresh").disabled = true;
  state.notice = "正在扫描插件目录…";
  renderNotice();
  setTimeout(() => {
    state.busy = false;
    $("refresh").disabled = false;
    state.notice = "扫描完成：3 个插件 · 2 个原生驱动已登记（oracle / mssql）";
    renderAll();
  }, 900);
});

$("install").addEventListener("click", () => {
  state.notice = "演示：安装入口会打开插件包选择器（.zip / .tar.gz / 目录）";
  renderNotice();
});

$("import-dir").addEventListener("click", () => {
  $("dir-input").click();
});

$("dir-input").addEventListener("change", (e) => {
  const count = e.target.files ? e.target.files.length : 0;
  state.notice = count ? `已选择 ${count} 个文件；安装链会校验 plugin.toml 与入口存在性` : "未选择目录";
  renderNotice();
});

document.querySelectorAll("[data-toast]").forEach((el) => {
  el.addEventListener("click", () => {
    state.notice = `演示：切换到「${el.dataset.toast}」面板`;
    renderNotice();
  });
});

$("close-conn").addEventListener("click", () => $("conn-dialog").close());
$("cancel-conn").addEventListener("click", () => $("conn-dialog").close());
$("test-conn").addEventListener("click", () => {
  $("conn-dialog").close();
  const driver = $("driver-select").value;
  state.notice = `演示：已用「${driver}」发起测试连接（不会真的连库）`;
  renderNotice();
});

$("theme-toggle").addEventListener("click", () => {
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  $("theme-toggle").textContent = next === "dark" ? "☀ 亮色" : "☾ 暗色";
});

renderAll();
</script>
</body>
</html>
