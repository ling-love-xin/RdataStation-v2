<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RdataStation · 版本与依赖（设计稿）</title>
<style>
:root{
  --canvas:#EBEBEB; --canvas-ink:#4A4A4A; --dot:#C9C9C9;
  --bg:#FFFFFF; --fg:#333333; --border:#D4D4D4; --border-soft:#E7E7E7;
  --primary:#BC5340; --primary-fg:#FFFFFF; --primary-hover:#A8452F;
  --title:#F8F8F8; --status:#F3F3F3; --muted:#6E6E6E; --muted-bg:#F3F3F3;
  --group:#F5F5F5; --hover:#F0F0F0; --stripe:#FAFAFA;
  --success:#15803D; --danger:#B91C1C; --warning:#A16207; --info:#1D4ED8;
  --shadow:0 18px 44px rgba(0,0,0,.20);
  --radius:6px; --radius-sm:4px;
  --mono:"Cascadia Mono","Consolas","SF Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
}
html[data-theme="dark"]{
  --canvas:#0C0C0C; --canvas-ink:#8A8A8A; --dot:#242424;
  --bg:#1F1F1F; --fg:#CCCCCC; --border:#3C3C3C; --border-soft:#2B2B2B;
  --primary:#E8846F; --primary-fg:#1E1E1E; --primary-hover:#F5A188;
  --title:#181818; --status:#181818; --muted:#8A8A8A; --muted-bg:#3A3D41;
  --group:#171717; --hover:#2A2D2E; --stripe:#232323;
  --success:#89D185; --danger:#F14C4C; --warning:#E3B341; --info:#75BEFF;
  --shadow:0 20px 50px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--canvas); color:var(--canvas-ink); font-family:var(--sans);
  font-size:13px; -webkit-font-smoothing:antialiased;
}
/* ---------- 原型控制条（不属于应用 UI） ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;
  border-bottom:1px solid rgba(128,128,128,.18)}
.bar .label{font-size:11px;letter-spacing:.06em;opacity:.6}
.seg{display:flex;border:1px solid rgba(128,128,128,.32);border-radius:var(--radius-sm);overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:5px 11px;border:0;cursor:pointer;background:transparent;color:inherit}
.seg button+button{border-left:1px solid rgba(128,128,128,.22)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.seg button:hover[aria-pressed="false"]{background:rgba(128,128,128,.14)}
.bar .note{margin-left:auto;font-size:11px;opacity:.55}
/* ---------- 舞台 ---------- */
.stage{display:flex;justify-content:center;padding:20px 12px 30px}
.app{
  width:1160px;height:700px;flex:none;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0/16px 16px, var(--canvas);
  border:1px solid var(--border);border-radius:8px;
}
.appbar{
  height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--title);border-bottom:1px solid var(--border);color:var(--fg);
}
.appbar .logo{width:16px;height:16px;border-radius:4px;background:var(--primary);flex:none}
.appbar .name{font-size:12px;font-weight:600}
.appbar .dim{font-size:11px;color:var(--muted)}
.appbar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
/* ---------- 版本窗口 ---------- */
.win{
  position:absolute;left:90px;top:74px;width:980px;height:620px;
  background:var(--bg);color:var(--fg);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
}
.wtitle{
  height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--title);border-bottom:1px solid var(--border);
}
.wtitle .ttl{font-size:13px;font-weight:600}
.wtitle .spacer{flex:1}
.wbtns{display:flex;gap:6px}
.btn{
  font:inherit;font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--fg);
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.br{width:10px;height:10px;display:block}
.mini{width:10px;height:10px;background:transparent;border:0;cursor:pointer;color:var(--muted)}
/* ---------- 主体两栏 ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr}
.left{border-right:1px solid var(--border);padding:14px 16px;overflow:auto}
.right{display:flex;flex-direction:column;min-width:0}
/* 左栏字段 */
.sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  margin:2px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--border-soft)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:2px 10px;margin-bottom:4px}
.kv dt{color:var(--muted);font-size:11.5px;padding-top:2px}
.kv dd{margin:0;font-size:12.5px;word-break:break-all}
.mono{font-family:var(--mono);font-size:12px}
.hero{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hero .tag{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.01em}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 6px;
  border:1px solid currentColor;border-radius:999px;line-height:1.5;white-space:nowrap;
}
.tag.ok{color:var(--success)} .tag.bad{color:var(--danger)} .tag.unk{color:var(--muted)}
.tag.soft{color:var(--muted);border-color:var(--border);background:var(--muted-bg)}
.tag.vendor{color:var(--warning)}
.alert{
  display:flex;gap:8px;padding:8px 10px;margin:10px 0 4px;border-radius:var(--radius-sm);
  border:1px solid color-mix(in srgb, var(--warning) 40%, transparent);
  background:color-mix(in srgb, var(--warning) 9%, transparent);
  font-size:11.5px;line-height:1.5;color:var(--fg);
}
.alert b{color:var(--warning);display:block;margin-bottom:1px}
/* ---------- 右栏工具条 ---------- */
.tools{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--border)}
.search{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;min-width:210px;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);
}
.search:focus-within{border-color:var(--primary)}
.search input{
  border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:12px;width:100%;
}
.search .hint{font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chip{
  font:inherit;font-size:11.5px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--muted);white-space:nowrap;
}
.chip:hover{background:var(--hover);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--muted-bg);border-color:var(--border);color:var(--fg);font-weight:600}
/* ---------- 表格 ---------- */
.wrap{flex:1;min-height:0;overflow:auto;padding:0 0 2px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:0 8px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--border-soft)}
thead th{
  position:sticky;top:0;z-index:1;height:32px;font-size:11px;font-weight:600;color:var(--muted);
  background:var(--bg);border-bottom:1px solid var(--border);letter-spacing:.02em;white-space:nowrap;
}
thead th[data-sort]{cursor:pointer}
thead th[data-sort]:hover{color:var(--fg)}
tbody tr{height:36px}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--hover)}
tr.grp td{
  height:26px;background:var(--group);color:var(--muted);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border-soft);
}
td.name .dn{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
td.name .cn{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:1px}
td.ver{font-family:var(--mono);font-size:11.5px}
td.eng{font-size:11.5px;color:var(--muted)}
td.eng b{color:var(--fg);font-family:var(--mono);font-size:11.5px;font-weight:600}
td.src .tag{font-size:10px}
td.lic{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
td.use{font-size:11.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--primary);font-size:10px}
/* ---------- 页脚 ---------- */
.foot{
  height:34px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-top:1px solid var(--border);background:var(--status);
  font-size:11px;color:var(--muted);
}
.foot .spacer{flex:1}
.foot .src{font-size:10.5px}
/* ---------- toast（原型反馈） ---------- */
.toast{
  position:absolute;left:50%;bottom:46px;transform:translate(-50%,8px);
  background:var(--fg);color:var(--bg);font-size:12px;padding:6px 12px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:5;
}
.toast.on{opacity:.94;transform:translate(-50%,0)}
@media (max-width:1240px){ .stage{zoom:.92} }
</style>
</head>
