<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RdataStation 数据库对象属性面板 · 三部分布局原型（对齐 DBeaver）</title>
<style>
:root{
  --pagebg:#ECECEC; --bg:#FFFFFF; --fg:#333333; --border:#D4D4D4; --input-border:#C9C9C9;
  --sidebar:#F3F3F3; --sidebar-border:#E7E7E7; --accent:#E4E4E4; --hover:#F0F0F0;
  --active-border:#C25B46; --muted:#8E8E8E; --primary:#C25B46; --primary-fg:#FFFFFF; --primary-hover:#A84A38;
  --titlebar:#DDDDDD; --tabbar:#F3F3F3; --tabactive-bg:#FFFFFF; --tabactive-fg:#333333;
  --match:#FFF3C4;
  --success:#16A34A; --success-bg:#F0FDF4; --warning:#B45309; --warning-bg:#FFFBEB;
  --info:#2563EB; --info-bg:#EFF6FF; --danger:#DC2626; --danger-bg:#FEF2F2;
  --overview-bg:#FAFAF8; --card-border:#E2E2DC; --shadow:0 18px 50px rgba(20,20,30,.16), 0 2px 8px rgba(20,20,30,.08);
}
[data-theme="dark"]{
  --pagebg:#141414; --bg:#1E1E1E; --fg:#CCCCCC; --border:#3C3C3C; --input-border:#4A4A4A;
  --sidebar:#252526; --sidebar-border:#333333; --accent:#37373D; --hover:#2A2D2E;
  --active-border:#E8846F; --muted:#8A8A8A; --primary:#E8846F; --primary-fg:#1E1E1E; --primary-hover:#F5A188;
  --titlebar:#323233; --tabbar:#252526; --tabactive-bg:#1E1E1E; --tabactive-fg:#FFFFFF;
  --match:#4A3F00;
  --success:#89D185; --success-bg:#14532D; --warning:#CCA700; --warning-bg:#3A3105;
  --info:#3794FF; --info-bg:#0F2A4A; --danger:#F14C4C; --danger-bg:#4A1A1A;
  --overview-bg:#1B1B1B; --card-border:#303030; --shadow:0 20px 56px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--pagebg);color:var(--fg);padding:32px 20px 40px;font-size:13px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
svg.ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
svg.ico-sm{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.page-head{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto 14px;padding:0 4px;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#F5A188,#C25B46);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(194,91,70,.35);color:#fff;}
.page-head h1{font-size:16px;font-weight:700;letter-spacing:.2px;}
.page-head .sub{color:var(--muted);font-size:12px;margin-top:2px;}
.theme-toggle{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .15s;}
.theme-toggle:hover{background:var(--hover);border-color:var(--active-border);}
.statebar{max-width:1000px;margin:0 auto 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 4px;}
.statebar .lbl{font-size:11px;color:var(--muted);margin-right:2px;}
.statebar button{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .15s;}
.statebar button:hover{background:var(--hover);color:var(--fg);}
.statebar button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);font-weight:600;}
.frame{max-width:1000px;margin:0 auto;display:flex;height:700px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);}
/* ===== 右侧属性面板（三部分布局主体） ===== */
.panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
/* 面板头：对象路径 + 刷新 */
.panel-head{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--sidebar-border);background:var(--tabbar);}
.panel-head .crumb{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.panel-head .crumb b{color:var(--fg);font-weight:600;}
.panel-head .sp{flex:1;}
.iconbtn{width:24px;height:24px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;}
.iconbtn:hover{background:var(--hover);color:var(--fg);border-color:var(--border);}
/* ===== ① 洞察总览（新增部分） ===== */
.overview{border-bottom:1px solid var(--sidebar-border);background:var(--overview-bg);padding:10px 12px 12px;}
.ov-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ov-badge{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.ov-badge.conn{background:linear-gradient(135deg,#60A5FA,#2563EB);}
.ov-badge.schema{background:linear-gradient(135deg,#34D399,#059669);}
.ov-badge.table{background:linear-gradient(135deg,#FBBF24,#D97706);}
.ov-title{font-size:13px;font-weight:700;line-height:1.2;}
.ov-sub{font-size:11px;color:var(--muted);}
.ov-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot.on{background:var(--success);box-shadow:0 0 0 3px var(--success-bg);}
.dot.err{background:var(--danger);box-shadow:0 0 0 3px var(--danger-bg);}
.dot.off{background:var(--muted);}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.stat-card{border:1px solid var(--card-border);border-radius:8px;padding:6px 8px;background:var(--bg);}
.stat-card .k{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.stat-card .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
.stat-card .u{font-size:10px;color:var(--muted);font-weight:400;margin-left:2px;}
.stat-card .delta{font-size:10px;color:var(--success);}
.ov-kv{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:11px;color:var(--muted);}
.ov-kv span b{color:var(--fg);font-weight:600;margin-left:3px;}
.ov-note{font-size:10px;color:var(--muted);margin-top:6px;border-top:1px dashed var(--card-border);padding-top:6px;}
.ov-note .tag{display:inline-block;border:1px solid var(--card-border);border-radius:4px;padding:0 5px;margin-right:6px;font-size:10px;color:var(--info);background:var(--info-bg);}
/* ===== ② General 属性区（DBeaver 上部对齐） ===== */
.general{padding:8px 12px;border-bottom:1px solid var(--sidebar-border);max-height:230px;overflow-y:auto;}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:6px 0 4px;}
.sec-title:first-child{margin-top:0;}
.prop-row{display:flex;align-items:flex-start;gap:10px;padding:2px 0;}
.prop-row .k{width:104px;flex:none;font-size:12px;color:var(--muted);padding-top:4px;}
.prop-row .v{flex:1;min-width:0;font-size:12px;padding-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.prop-row.readonly .v{color:var(--fg);}
.prop-row .edit-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--muted);display:none;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:all .12s;}
.prop-row .edit-btn:hover{background:var(--hover);color:var(--primary);border-color:var(--active-border);}
.prop-row.editable:hover .edit-btn{display:flex;}
.prop-row .v input[type=text]{width:100%;max-width:260px;border:1px solid var(--input-border);border-radius:5px;padding:3px 7px;font-size:12px;background:var(--bg);color:var(--fg);outline:none;}
.prop-row .v input[type=text]:focus{border-color:var(--active-border);}
.prop-row .v select{border:1px solid var(--input-border);border-radius:5px;padding:2px 6px;font-size:12px;background:var(--bg);color:var(--fg);}
.prop-row .v textarea{border:1px solid var(--input-border);border-radius:5px;padding:3px 7px;font-size:12px;background:var(--bg);color:var(--fg);width:100%;max-width:260px;resize:vertical;min-height:30px;}
.prop-row .save-btn,.prop-row .cancel-btn{border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;background:var(--bg);color:var(--fg);}
.prop-row .save-btn{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);}
.prop-row .save-btn:hover{background:var(--primary-hover);}
.prop-row .cancel-btn:hover{background:var(--hover);}
.switch{width:30px;height:16px;border-radius:9px;background:var(--border);position:relative;cursor:pointer;transition:background .15s;flex:none;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch.on{background:var(--primary);}
.switch.on::after{left:16px;}
.flag{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--card-border);border-radius:4px;padding:0 5px;font-size:10px;color:var(--muted);}
.flag.ok{color:var(--success);border-color:var(--success);}
/* ===== ③ 子项列表区（DBeaver 下部对齐） ===== */
.sub{flex:1;display:flex;min-height:0;}
.sub-side{width:150px;flex:none;border-right:1px solid var(--sidebar-border);background:var(--sidebar);overflow-y:auto;padding:6px 0;}
.sub-item{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:12px;color:var(--fg);cursor:pointer;border-left:2px solid transparent;transition:all .1s;}
.sub-item:hover{background:var(--hover);}
.sub-item.on{background:var(--accent);border-left-color:var(--active-border);font-weight:600;}
.sub-item .cnt{margin-left:auto;font-size:10px;color:var(--muted);background:var(--accent);border-radius:8px;padding:0 6px;line-height:15px;}
.sub-item.on .cnt{background:var(--bg);}
.sub-item.gray{color:var(--muted);cursor:default;}
.sub-item.gray:hover{background:transparent;}
.sub-item.gray .cnt{background:var(--hover);}
.sub-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.sub-head{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--sidebar-border);font-size:11px;color:var(--muted);}
.sub-head b{color:var(--fg);font-size:12px;}
.sub-head .sp{flex:1;}
.sub-head .hint{font-size:10px;color:var(--muted);}
.grid-wrap{flex:1;overflow:auto;padding:4px 8px 8px;}
table.grid{width:100%;border-collapse:collapse;font-size:12px;}
table.grid th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:4px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);white-space:nowrap;}
table.grid td{padding:4px 8px;border-bottom:1px solid var(--sidebar-border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
table.grid tr:hover td{background:var(--hover);}
.vtag{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1px solid var(--primary);border-radius:3px;color:var(--primary);font-size:10px;line-height:1;}
.null-mark{color:var(--muted);}
.empty-hint{padding:18px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--border);border-radius:8px;margin-top:8px;}
.foot{height:26px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--sidebar-border);font-size:11px;color:var(--muted);background:var(--tabbar);}
.foot .sp{flex:1;}
.legend{display:inline-flex;align-items:center;gap:4px;margin-left:auto;}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:3px;}
/* 说明条 */
.note-bar{max-width:1000px;margin:14px auto 0;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:12px;color:var(--muted);line-height:1.7;}
.note-bar h3{font-size:13px;color:var(--fg);margin-bottom:6px;}
.note-bar code{background:var(--accent);border-radius:4px;padding:1px 5px;font-size:11px;}
.note-bar table{border-collapse:collapse;width:100%;margin-top:8px;}
.note-bar th,.note-bar td{border:1px solid var(--border);padding:4px 8px;text-align:left;font-size:12px;}
.note-bar th{background:var(--accent);color:var(--fg);}
</style>
</head>
<body data-theme="light">
<div class="page-head">
  <div class="brand">
    <div class="logo"><svg class="ico" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg></div>
    <div><h1>数据库对象属性面板 · 三部分布局</h1><div class="sub">洞察总览 + General 属性（DBeaver 上部）+ 子项列表（DBeaver 下部）</div></div>
  </div>
  <button class="theme-toggle" id="themeToggle">🌓 切换明暗</button>
</div>

</div>

<div class="frame">

    </div>

    <!-- ===== ① 洞察总览 ===== -->
    <div class="overview" id="overview"></div>

    <!-- ===== ② General 属性（DBeaver 上部） ===== -->
    <div class="general" id="general"></div>

    <!-- ===== ③ 子项列表（DBeaver 下部） ===== -->

    </div>
  </div>
</div>

<div class="note-bar" id="noteBar"></div>

const NOTE={
  conn:'<h3>① 洞察总览（本原型新增部分）</h3><p>DBeaver 的属性面板是<b>上下两部分</b>：上部 General 属性网格、下部（左对象类别树 + 右子项表格）。我们在此基础上增加<b>洞察总览</b>——打开对象即见关键统计（对象计数 / 缓存命中 / 版本 / 连接状态），无需逐项展开。<b>三部分自上而下：洞察总览 → General 属性 → 子项列表</b>。</p><table><tr><th>部分</th><th>对齐 DBeaver</th><th>数据来源（RDS）</th></tr><tr><td>① 洞察总览</td><td>新增</td><td>内省缓存计数（L1/L2）+ 连接状态（nav_view）+ 懒加载统计（reltuples / pg_total_relation_size）</td></tr><tr><td>② General 属性</td><td>上部（@Property viewable / editable / listProvider / MULTILINE）</td><td><code>load_properties</code> 描述符（id / category / editable / value_kind）</td></tr><tr><td>③ 子项列表</td><td>下部（类别树 + 表格）</td><td><code>list_columns / list_indexes / list_constraints / 内省</code>（现有）</td></tr></table><h3 style="margin-top:10px">属性编辑对齐（@Property editable=true → setter）</h3><p>DBeaver：<code>getDescription(monitor)</code> 懒加载（查 <code>pg_shdescription</code>），<code>setDescription</code> 提交 <code>COMMENT</code>；<code>getDBA</code> 下拉（RoleListProvider）→ <code>setDBA</code>；<code>getTablespace</code> 下拉 → <code>setTablespace</code>。<b>RDS 已落地</b>：PropertyRow 描述符化 + apply_property_edit（PG 列级 RENAME/COMMENT/DEFAULT/NULLABLE）；连接/表级描述编辑（COMMENT ON DATABASE/SCHEMA/TABLE）为下一步。</p>',
  schema:'<h3>Schema 洞察与属性</h3><p>洞察总览 = Schema 内省结果（表 / 视图 / 函数 / 序列 计数，一次连接内省全类别）；General 属性对齐 <code>PostgreSchema</code>（名称 / 所有者 / 描述）；子项列表对齐 DBeaver 左侧类别树（表 → 权限 / 源 等 11 类）。</p>',
  table:'<h3>表洞察与属性</h3><p>洞察总览 = 列 / 索引 / 约束 / 行数（reltuples 懒加载）；General 属性对齐 <code>PostgreTable</code>（表空间 / 行级安全 / 分区 / 额外选项 / 描述）；子项列表 = 列 / 约束 / 外键 / 索引 / 触发器 / 权限 / DDL 等 14 类。列网格对齐 DBeaver 列页（列名 / # / 数据类型 / 标识 / 排序规则 / 非空 / 默认值 / 注释）。</p>',
};

function renderOverview(){

    </div>

    <div class="ov-kv">${d.kv.map(p=>`<span>${p[0]}<b>${p[1]}</b></span>`).join('')}</div>
    <div class="ov-note">${d.note}</div>`;
}
function renderGeneral(){
  const d=DATA[cur];
  $('#general').innerHTML=d.general.map(sec=>`

    ${sec.rows.map(r=>renderPropRow(r)).join('')}
  `).join('');
}
function renderPropRow(r){
  let valCell='';
  if(r.kind==='bool'){
    valCell=`<div class="v"><span class="switch ${r.v?'on':''}"></span>${r.edit?'<span class="flag ok">可编辑</span>':''}</div>`;
  }else if(r.kind==='select'){
    valCell=`<div class="v"><select><option>${r.v}</option>${r.opts.filter(o=>o!==r.v).map(o=>`<option>${o}</option>`).join('')}</select><span class="flag ok">可编辑</span></div>`;
  }else if(r.kind==='longtext'){
    valCell=`<div class="v"><span>${r.v}</span><button class="edit-btn" title="编辑（长文本）"><svg class="ico-sm" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button><span class="flag ok">可编辑</span></div>`;
  }else{
    valCell=`<div class="v"><span>${r.v}</span>${r.edit?`<button class="edit-btn" title="编辑"><svg class="ico-sm" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button><span class="flag ok">可编辑</span>`:''}</div>`;
  }
  return `<div class="prop-row ${r.edit?'editable':'readonly'}"><div class="k">${r.k}</div>${valCell}</div>`;
}
function renderSub(){
  const d=DATA[cur];
  const active=d.sub.find(s=>s.on)||d.sub[0];
  $('#sub').innerHTML=`
    <div class="sub-side">${d.sub.map(s=>`
      <div class="sub-item ${s.on?'on':''} ${s.gray?'gray':''}">
        ${s.icon}${s.t}${s.rows.length?`<span class="cnt">${s.rows.length}</span>`:''}
      </div>`).join('')}
    </div>
    <div class="sub-main">
      <div class="sub-head"><b>${active.t}</b><span>（${active.rows.length} 项）</span><div class="sp"></div><span class="hint">${active.gray?'能力未实现：先绘制、置灰标注':'实时内省'}</span></div>
      <div class="grid-wrap">${active.rows.length?`
        <table class="grid"><thead><tr>${active.grid.map(g=>`<th>${g}</th>`).join('')}</tr></thead>
        <tbody>${active.rows.map(row=>`<tr>${row.map((cell,i)=>`<td>${cell==='✓'?'<span class="vtag">✓</span>':cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`:
        `<div class="empty-hint">暂无 ${active.t}（类别已注册，内容为空）</div>`}
      </div>
    </div>`;
}
function renderCrumb(){
  const d=DATA[cur];

function renderAll(){
  renderOverview();renderGeneral();renderSub();renderCrumb();renderNote();
  $$('.statebar button').forEach(b=>b.classList.remove('on'));
  $('#sw'+cur.charAt(0).toUpperCase()+cur.slice(1)).classList.add('on');
}
$('#themeToggle').addEventListener('click',()=>{
  const b=document.body.dataset.theme==='light'?'dark':'light';
  document.body.dataset.theme=b;localStorage.setItem(THEME_KEY,b);
});
$('#swConn').addEventListener('click',()=>{cur='conn';renderAll();});
$('#swSchema').addEventListener('click',()=>{cur='schema';renderAll();});
$('#swTable').addEventListener('click',()=>{cur='table';renderAll();});
let dbOn=false;
$('#swDbeaver').addEventListener('click',()=>{
  dbOn=!dbOn;const b=$('#swDbeaver');b.classList.toggle('on',dbOn);
  const d=DATA[cur];const an=DB_ANNOT[cur];
  if(dbOn){
    b.textContent='收起对照';
    $('#noteBar').innerHTML=`<h3>对照 DBeaver 源码（${an.src}）</h3><p>属性描述符：<code>${an.props}</code></p><p>${an.sub}</p>`;
  }else{b.textContent='对照 DBeaver';renderNote();}
});
renderAll();
