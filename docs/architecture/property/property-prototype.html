<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RdataStation 属性面板 · 可交互原型</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --tab-bar: #2d2d30; --border: #3c3c3c;
    --fg: #d4d4d4; --muted: #8a8a8a; --accent: #d66a5a; --danger: #f14c4c;
    --row-hover: #2a2d2e; --disabled: #5a5a5a;
  }
  html[data-theme="light"] {
    --bg: #f5f5f5; --panel: #ffffff; --tab-bar: #ececec; --border: #e0e0e0;
    --fg: #333333; --muted: #8a8a8a; --accent: #c0503f; --danger: #d93025;
    --row-hover: #f0f0f0; --disabled: #bdbdbd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; display: flex; gap: 16px; padding: 16px;
  }
  /* 左侧：对象选择器（模拟导航树选中对象） */
  .sidebar {
    width: 240px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar h3 { font-size: 12px; font-weight: 600; padding: 12px 14px 8px; color: var(--muted); }
  .tree { flex: 1; overflow: auto; padding: 0 6px 10px; }
  .tree-node { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tree-node:hover { background: var(--row-hover); }
  .tree-node.active { background: var(--row-hover); color: var(--accent); }
  .tree-node .t { color: var(--muted); }
  .tree-children { margin-left: 16px; }
  .btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--fg);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  /* 右侧：属性面板模拟 */
  .panel {
    flex: 1; max-width: 560px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: var(--tab-bar); border-bottom: 1px solid var(--border);
  }
  .panel-head .obj { font-weight: 600; font-size: 13px; }
  .panel-head .kind { color: var(--muted); font-size: 12px; }
  .panel-head .spacer { flex: 1; }
  .close { cursor: pointer; color: var(--muted); font-size: 14px; padding: 0 4px; }
  .close:hover { color: var(--danger); }
  .tabs { display: flex; background: var(--tab-bar); border-bottom: 1px solid var(--border); padding: 0 8px; }
  .tab {
    padding: 8px 14px; font-size: 12px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; user-select: none; white-space: nowrap;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab.unsupported { color: var(--disabled); text-decoration: line-through; }
  .tab.unsupported.active { color: var(--disabled); border-bottom-color: var(--disabled); text-decoration: none; }
  .content { flex: 1; overflow: auto; padding: 14px; font-size: 12.5px; line-height: 1.6; }
  /* 属性网格 */
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.grid td.k { width: 96px; color: var(--muted); white-space: nowrap; }
  /* 分区表格 */
  table.rows { width: 100%; border-collapse: collapse; }
  table.rows th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  table.rows td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  /* 数据页网格：行号槽 / 可排序列头 / NULL 置灰 / 页脚 */
  table.rows.data th.sortable { cursor: pointer; user-select: none; }
  table.rows.data th.sortable:hover { color: var(--accent); }
  table.rows.data th.rowno, table.rows.data td.rowno { color: var(--muted); width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  table.rows.data td.null { color: var(--disabled); font-style: italic; }
  .data-footer { color: var(--muted); font-size: 11.5px; padding: 8px 8px 4px; }
  .pager { display: flex; gap: 8px; padding: 4px 8px 8px; }
  .btn { background: var(--tab-bar); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  pre.ddl {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-all;
  }
  .placeholder {
    border: 1px dashed var(--border); border-radius: 6px; padding: 24px 16px;
    text-align: center; color: var(--muted);
  }
  .placeholder .ico { font-size: 22px; margin-bottom: 8px; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); margin-left: 8px; }
  .loading { color: var(--muted); padding: 20px; text-align: center; }
</style>
</head>
<body data-theme="dark">

<div class="sidebar">
  <h3>导航（模拟选中对象）</h3>
  <div class="tree">
    <div class="tree-node" data-obj="conn"><span class="t">◆</span> SQLite 演示库</div>
    <div class="tree-children">
      <div class="tree-node" data-obj="table-orders"><span class="t">▾</span> 表</div>
      <div class="tree-children">
        <div class="tree-node" data-obj="table-orders"><span class="t">▤</span> orders</div>
        <div class="tree-node" data-obj="table-parent"><span class="t">▤</span> parent</div>
      </div>
      <div class="tree-node" data-obj="view-vorders"><span class="t">▾</span> 视图</div>
      <div class="tree-children">
        <div class="tree-node" data-obj="view-vorders"><span class="t">▧</span> v_orders</div>
      </div>
      <div class="tree-node" data-obj="col-tag"><span class="t">▸</span> orders <span class="t">·</span> tag</div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <span class="obj" id="obj-name">orders</span>
    <span class="kind" id="obj-kind">表</span>
    <span class="badge" id="obj-state">已连接</span>
    <span class="spacer"></span>
    <span class="close" title="关闭面板">✕</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</div>

<div style="display:flex;flex-direction:column;gap:12px;">
  <button class="btn" id="theme-btn">切换主题（亮/暗）</button>
  <div class="hint" style="width:150px;">
    原型说明：页签集合由对象类型驱动（注册表数据），
    「权限 / 依赖」为灰置占位（驱动能力未实现，先绘制不可用）。
    选择左侧对象可切换对象与页签。
  </div>
</div>

<script>
// ---- 原型数据：与 SQLite 全链路验证 fixture 同构 ----
const OBJECTS = {
  conn: {
    name: "SQLite 演示库", kind: "连接", tabs: ["通用", "权限"],
    general: [["名称", "SQLite 演示库"], ["数据库类型", "SQLite"], ["归属域", "全局"], ["驱动", "sqlite"], ["地址", "…/rds_nav_prop_sqlite.db"]],
    unsupported: ["权限"],
  },
  "table-orders": {
    name: "orders", kind: "表", tabs: ["通用", "列", "索引", "约束", "DDL", "数据", "权限", "依赖"],
    general: [["名称", "orders"], ["类型", "表"], ["列数", "4"], ["行数", "7"], ["归属域", "全局"], ["限定名", "main.orders"]],
    columns: { head: ["#", "名称", "类型", "可空", "主键", "外键", "默认值", "注释"],
      rows: [
        ["1", "id", "INTEGER", "否", "✔", "", "", ""],
        ["2", "parent_id", "INTEGER", "是", "", "→ parent(id)", "", ""],
        ["3", "tag", "TEXT", "是", "", "", "", ""],
        ["4", "note", "TEXT", "是", "", "", "'x'", ""],
      ]},
    indexes: { head: ["名称", "唯一", "列"],
      rows: [["idx_orders_tag", "✔", "tag"]]},
    constraints: { head: ["名称", "类型", "定义"],
      rows: [["", "外键", "parent_id REFERENCES parent(id)"], ["", "主键", "PRIMARY KEY (id)"]]},
    ddl: "CREATE TABLE orders (id INTEGER PRIMARY KEY, parent_id INTEGER, tag TEXT, note TEXT DEFAULT 'x', FOREIGN KEY (parent_id) REFERENCES parent(id))",
    data: { columns: ["id", "parent_id", "tag", "note"], total: 7, ordered: true,
      rows: [
        ["1", "1", "t1", "x"], ["2", "2", "t2", "x"], ["3", null, "t3", "x"],
        ["4", "3", "t4", "x"], ["5", "4", "t5", "x"], ["6", "5", "t6", "y"], ["7", "6", "t7", "y"],
      ]},
    unsupported: ["权限", "依赖"],
  },
  "table-parent": {
    name: "parent", kind: "表", tabs: ["通用", "列", "索引", "约束", "DDL", "数据", "权限", "依赖"],
    general: [["名称", "parent"], ["类型", "表"], ["列数", "2"], ["行数", "2"], ["归属域", "全局"], ["限定名", "main.parent"]],
    columns: { head: ["#", "名称", "类型", "可空", "主键", "外键", "默认值", "注释"],
      rows: [["1", "id", "INTEGER", "否", "✔", "", "", ""], ["2", "name", "TEXT", "否", "", "", "", ""]]},
    indexes: { head: ["名称", "唯一", "列"], rows: []},
    constraints: { head: ["名称", "类型", "定义"], rows: [["", "主键", "PRIMARY KEY (id)"]]},
    ddl: "CREATE TABLE parent (id INTEGER PRIMARY KEY, name TEXT NOT NULL)",
    data: { columns: ["id", "name"], total: 2, ordered: true, rows: [["1", "a"], ["2", "b"]]},
    unsupported: ["权限", "依赖"],
  },
  "view-vorders": {
    name: "v_orders", kind: "视图", tabs: ["通用", "列", "DDL", "数据", "权限"],
    general: [["名称", "v_orders"], ["类型", "视图"], ["列数", "2"], ["归属域", "全局"], ["限定名", "main.v_orders"]],
    columns: { head: ["#", "名称", "类型", "可空", "注释"],
      rows: [["1", "id", "INTEGER", "是", ""], ["2", "tag", "TEXT", "是", ""]]},
    ddl: "CREATE VIEW v_orders AS SELECT id, tag FROM orders",
    data: { columns: ["id", "tag"], total: 7, ordered: false,
      rows: [["1", "t1"], ["2", "t2"], ["3", "t3"], ["4", "t4"], ["5", "t5"], ["6", "t6"], ["7", "t7"]]},
    unsupported: ["权限"],
  },
  "col-tag": {
    name: "tag", kind: "列", tabs: ["通用"],
    general: [["名称", "tag"], ["所属表", "orders"], ["类型", "TEXT"], ["可空", "是"], ["主键", "否"], ["外键", "否"], ["引用", ""], ["默认值", ""], ["注释", ""]],
    unsupported: [],
  },
};

const TAB_LABEL = { "通用": "通用", "列": "列", "索引": "索引", "约束": "约束", "DDL": "DDL", "数据": "数据", "权限": "权限", "依赖": "依赖" };

let current = "table-orders";
let activeTab = "通用";
// 数据页交互状态（分页 + 排序，与 workbench `render_data_page` 同规则）
let dataState = { offset: 0, limit: 5, sortCol: null, asc: true };

function render() {
  const obj = OBJECTS[current];
  const el = document.querySelector('.tree-node[data-obj="' + current + '"]');
  document.querySelectorAll('.tree-node').forEach(n => n.classList.toggle('active', n === el));
  document.getElementById('obj-name').textContent = obj.name;
  document.getElementById('obj-kind').textContent = obj.kind;
  document.getElementById('obj-state').textContent = "已连接";

  // tabs
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  obj.tabs.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tab' + (t === activeTab ? ' active' : '') + (obj.unsupported.includes(t) ? ' unsupported' : '');
    d.textContent = TAB_LABEL[t] || t;
    d.onclick = () => { if (t !== activeTab) { activeTab = t; render(); } };
    tabs.appendChild(d);
  });
  if (!obj.tabs.includes(activeTab)) { activeTab = obj.tabs[0]; render(); return; }
  renderContent(obj);
}

function cellHtml(v) {
  return v === null || v === undefined
    ? '<td class="null">NULL</td>'
    : '<td>' + v + '</td>';
}

function renderContent(obj) {
  const c = document.getElementById('content');
  if (obj.unsupported.includes(activeTab)) {
    c.innerHTML =
      '<div class="placeholder"><div class="ico">🔒</div>' +
      '「' + activeTab + '」查看与操作暂不支持（驱动能力未实现）' +
      '<div class="hint">页签先绘制、置灰不可用；驱动补内省能力位后由注册表翻转为可用，渲染零改动。</div></div>';
    return;
  }
  if (activeTab === '通用') {
    let html = '<table class="grid">';
    obj.general.forEach(([k, v]) => html += '<tr><td class="k">' + k + '</td><td>' + v + '</td></tr>');
    html += '</table>';
    c.innerHTML = html;
  } else if (activeTab === '列' || activeTab === '索引' || activeTab === '约束') {
    const t = obj[activeTab === '列' ? 'columns' : activeTab];
    if (!t) { c.innerHTML = '<div class="placeholder">该对象无「' + activeTab + '」数据</div>'; return; }
    let html = '<table class="rows"><tr>' + t.head.map(h => '<th>' + h + '</th>').join('') + '</tr>';
    t.rows.forEach(r => html += '<tr>' + r.map(cell => '<td>' + cell + '</td>').join('') + '</tr>');
    html += '</table>';
    if (!t.rows.length) html = '<div class="placeholder">（无）</div>';
    c.innerHTML = html;
  } else if (activeTab === 'DDL') {
    c.innerHTML = '<pre class="ddl">' + obj.ddl + '</pre>';
  } else if (activeTab === '数据') {
    const d = obj.data;
    if (!d) { c.innerHTML = '<div class="placeholder">该对象无「数据」页</div>'; return; }
    // 排序（列头点击：未排序 → 升序 → 降序 → 循环），排序后回到第一页
    let rows = d.rows.slice();
    if (dataState.sortCol !== null) {
      const ix = d.columns.indexOf(dataState.sortCol);
      rows.sort((a, b) => {
        const av = a[ix], bv = b[ix];
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        const r = String(av).localeCompare(String(bv), undefined, { numeric: true });
        return dataState.asc ? r : -r;
      });
    }
    const hasMore = dataState.offset + dataState.limit < rows.length;
    const page = rows.slice(dataState.offset, dataState.offset + dataState.limit);
    let html = '<table class="rows data">';
    html += '<tr><th class="rowno">#</th>' + d.columns.map((col, i) => {
      const mark = dataState.sortCol === col ? (dataState.asc ? ' ↑' : ' ↓') : '';
      return '<th class="sortable" data-col="' + i + '">' + col + mark + '</th>';
    }).join('') + '</tr>';
    page.forEach((r, i) => {
      const rowNo = dataState.offset + i + 1;
      html += '<tr><td class="rowno">' + rowNo + '</td>' + r.map(cellHtml).join('') + '</tr>';
    });
    html += '</table>';
    let footer = '<div class="data-footer">共 ' + d.total + ' 行';
    if (!d.ordered && dataState.sortCol === null) footer += ' · 本页无定义顺序';
    footer += '</div><div class="pager">';
    if (dataState.offset > 0) footer += '<button class="btn" id="data-prev">‹ 上一页</button>';
    if (hasMore) footer += '<button class="btn" id="data-next">下一页 ›</button>';
    footer += '</div>';
    c.innerHTML = html + footer;
    document.querySelectorAll('.data .sortable').forEach(th => {
      th.onclick = () => {
        const col = d.columns[Number(th.dataset.col)];
        if (dataState.sortCol === col) { dataState.asc = !dataState.asc; } else { dataState.sortCol = col; dataState.asc = true; }
        dataState.offset = 0;
        render();
      };
    });
    const prev = document.getElementById('data-prev');
    if (prev) prev.onclick = () => { dataState.offset = Math.max(0, dataState.offset - dataState.limit); render(); };
    const next = document.getElementById('data-next');
    if (next) next.onclick = () => { dataState.offset += dataState.limit; render(); };
  }
}

document.querySelectorAll('.tree-node').forEach(n => {
  n.onclick = () => {
    current = n.dataset.obj; activeTab = OBJECTS[current].tabs[0];
    dataState = { offset: 0, limit: 5, sortCol: null, asc: true };
    render();
  };
});

document.getElementById('theme-btn').onclick = () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
};

render();
</script>
</body>
</html>
