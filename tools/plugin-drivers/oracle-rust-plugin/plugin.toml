# Oracle 原生 Rust 驱动插件：独立 sidecar（rds-oracle-sidecar），不依赖 JVM / Python。
# 驱动二进制不入库（.gitignore 忽略 bin/），由 build.ps1 构建后复制到 bin/win-x64/agent.exe。
# 许可：驱动实现为 MIT；依赖 oracle-rs 0.1.7 为 MIT OR Apache-2.0（纯 Rust，无需 OCI 客户端）。

[plugin]
id = "rds.driver.oracle-rust"
name = "Oracle Native Driver (Rust)"
version = "0.1.0"
publisher = "rds"
description = "Oracle 数据库原生 Rust 驱动（纯 Rust TNS 实现，无 JVM / OCI 依赖）"
license = "MIT"

[plugin.engines]
rdatastation = ">=0.1"

[backend]
kind = "sidecar"
runtime = "rust"
executable = "bin/agent"
transport = "framed"
protocol = "rds-driver/1"
platforms = ["win-x64"]
max_instances = 1

# sidecar 轨：起子进程 + 连网络 + 读自己的数据目录 + 接收数据库凭据
[permissions]
sidecar = ["spawn.child_process", "net.connect", "fs.read_plugin_data", "credentials.database"]
driver = ["driver.query", "driver.metadata", "driver.transaction"]
credentials = "database"

[capabilities.driver]
concurrency = "serial"

[[contributes.drivers]]
id = "oracle"
display_name = "Oracle Database"
default_port = 1521
url_template = "oracle://{username}:{password}@{host}:{port}/{database}"
features = ["schemas", "transactions"]
