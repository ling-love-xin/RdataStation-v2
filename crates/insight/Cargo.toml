[package]
name = "rds-insight"
version.workspace = true
edition.workspace = true
description = "M8 洞察模块：库/表/列画像、规则引擎、质量评分"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `shared::` 引用直接生效
engine = { path = "../engine", package = "rds-engine" }
shared = { path = "../shared", package = "rds-shared" }

# ===== Async 运行时 =====
tokio = { version = "1.44.1", features = ["full"] }

# ===== 序列化 =====
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.135"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "chrono"] }

# ===== 规则引擎 =====
include_dir = "0.7.4"
duckdb = { version = "1.10502.0", features = ["bundled"] }
rusqlite = { version = "0.32.1", features = ["bundled", "chrono", "serde_json"] }
tracing = "0.1.41"
once_cell = "1.20.0"
toml = "0.8.20"
