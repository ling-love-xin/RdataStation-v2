[package]
name = "rds-insight"
version.workspace = true
edition.workspace = true
description = "M8 洞察模块：库/表/列画像、规则引擎、质量评分"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `shared::` 引用直接生效
engine.workspace = true
shared.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 领域存储（store/）=====
# 快照主键与版本号生成。
uuid.workspace = true

# ===== 规则引擎 =====
include_dir.workspace = true
duckdb.workspace = true
tracing.workspace = true
toml.workspace = true

# ===== 规则索引存储（service/indexer）=====
# 索引写 SQLite（全局库 / 项目库），并对规则文件正文取 SHA256 做增量判据。
# 注：这两个依赖在迁移初期被带入时并无使用点，曾一度移除；现在索引存储真的用到，
# 故重新引入（sha2 同时用于「文件内容是否变化」的判据）。
rusqlite.workspace = true
sha2.workspace = true
