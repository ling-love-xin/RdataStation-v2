[package]
name = "rds-insight"
version.workspace = true
edition.workspace = true
description = "M8 洞察模块：库/表/列画像、规则引擎、质量评分"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `shared::` 引用直接生效
engine.workspace = true
shared.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 领域存储（store/）=====
# 快照主键与版本号生成。
uuid.workspace = true

# ===== 规则引擎 =====
include_dir.workspace = true
duckdb.workspace = true
tracing.workspace = true
toml.workspace = true

# ===== UI（视图与 model / service 同 crate，见 GPUI-kit 编码指南）=====
# M8 Phase 1 起：右 Dock 洞察面板的视图在本 crate（归属决策 D21 = 方案 A）
gpui-kit.workspace = true
# 视图共用资产（尺寸常量）：面板与外壳必须一致的值到这里取，**不再镜像**。
# 依赖方向 insight → workbench-shell（后者不得依赖任何特性 crate）。
workbench_shell.workspace = true

# ===== 规则索引存储（service/indexer）=====
# 索引写 SQLite（全局库 / 项目库），并对规则文件正文取 SHA256 做增量判据。
# 注：这两个依赖在迁移初期被带入时并无使用点，曾一度移除；现在索引存储真的用到，
# 故重新引入（sha2 同时用于「文件内容是否变化」的判据）。
rusqlite.workspace = true
sha2.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }
# 回归测试要手工构造 Arrow 批（`QueryResult` 的行全在 `batches` 里，见 service::result_columns_and_rows）
arrow.workspace = true
