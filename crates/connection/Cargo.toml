[package]
name = "rds-connection"
version.workspace = true
edition.workspace = true
description = "M3 数据源连接：原生连接 + DuckDB Secret 加速通道"

[dependencies]
# 依赖键命名为 shared，使 v1 迁移代码中的 `shared::` 引用直接生效
shared = { path = "../shared", package = "rds-shared" }

# ===== SSH / TLS 连接层 =====
russh = "0.49.0"
russh-keys = "0.49.0"
native-tls = "0.2.13"
tokio-native-tls = "0.3.1"
tokio-socks = "0.5.2"
x509-parser = "0.17"

# ===== Async 运行时 =====
tokio = { version = "1.44.1", features = ["full"] }
futures = "0.3.30"
async-trait = "0.1.88"

# ===== 序列化 =====
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.135"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "chrono"] }

# ===== 日志追踪 =====
tracing = "0.1.41"
thiserror = "1.0.69"
dirs = "5.0.1"
base64 = "0.22.1"

# ===== 时间 =====
chrono = { version = "0.4.41", features = ["serde"] }

# ===== DuckDB（Secret 本地加速通道） =====
duckdb = { version = "1.10502.0", features = ["bundled"] }

[dev-dependencies]
rand = "0.8"
