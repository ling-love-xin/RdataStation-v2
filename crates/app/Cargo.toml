[package]
name = "rds-app"
version.workspace = true
edition.workspace = true
description = "App Shell：组合窗口与 Feature 装配，不承载业务逻辑"

[[bin]]
name = "rds-app"
path = "src/main.rs"

[build-dependencies]
winresource.workspace = true

[dependencies]
gpui-kit.workspace = true
# Round 19：工作台视图（首个可交互骨架）
workbench.workspace = true
settings.workspace = true
# A10：编辑器的动作（Ctrl+S / Ctrl+/ / Ctrl+W）在 app 层统一绑键，需要它的 Action 类型
editor.workspace = true
# M8：洞察的重算动作（Ctrl+Shift+R，`insight` key context）同上
insight.workspace = true
# M6：资产库的动作（Ctrl+F / Esc / Delete，`analytics-resource` key context）同上
analytics_resource.workspace = true
# 应用启动装配：全局系统库初始化（M3 连接 / M4 元数据的持久化根）
engine.workspace = true
# 启动最早处：运行时数据根（TEMP 重定向 + 旧布局迁移）
paths.workspace = true
# 日志接线后本层要补记启动结果（订阅者挂上之前的信息只能在这里回填）
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
