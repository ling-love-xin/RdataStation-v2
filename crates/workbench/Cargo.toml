[package]
name = "rds-workbench"
version.workspace = true
edition.workspace = true
description = "M5 查询工作台：连接管理、结果集、SQL 执行编排"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `connection::` / `insight::` / `shared::` 引用直接生效
engine.workspace = true
connection.workspace = true
database.workspace = true
project.workspace = true
insight.workspace = true
shared.workspace = true
mock.workspace = true
settings.workspace = true
scratchpad.workspace = true

# ===== GPUI-kit 视图层（Round 19）=====
gpui-kit.workspace = true

[dev-dependencies]
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }

# ===== Async 运行时 =====
tokio.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 标识 =====
uuid.workspace = true

# ===== 其他 =====
tracing.workspace = true
duckdb.workspace = true
rusqlite.workspace = true
sha2.workspace = true
percent-encoding.workspace = true
