[package]
name = "rds-workbench"
version.workspace = true
edition.workspace = true
description = "M5 查询工作台：连接管理、结果集、SQL 执行编排"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `connection::` / `insight::` / `shared::` 引用直接生效
engine.workspace = true
connection.workspace = true
database.workspace = true
project.workspace = true
insight.workspace = true
shared.workspace = true
mock.workspace = true
settings.workspace = true
scratchpad.workspace = true
analytics_resource.workspace = true
# 运行时数据路径唯一解析点（全局系统库目录）
paths.workspace = true

# ===== 工作台外壳（面板状态与视图共用资产；视图下沉的防环层）=====
# 依赖方向：workbench → workbench-shell；特性 crate（database / scratchpad）下沉视图后 → workbench-shell。
workbench_shell.workspace = true

# ===== GPUI-kit 视图层（Round 19）=====
gpui-kit.workspace = true

# ===== SQL 编辑器（A9 接线：中央编辑区面板 + 打开/保存）=====
# 依赖方向：workbench → editor → engine / database / shared；editor 不反向依赖本 crate。
editor.workspace = true

# 系统文件对话框（编辑器打开 / 另存为，A9 收尾）
rfd.workspace = true
# 在系统文件管理器里打开日志目录（设置页的动作行）
opener.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 标识 =====
uuid.workspace = true

# ===== 其他 =====
tracing.workspace = true
duckdb.workspace = true
rusqlite.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }
