[package]
name = "rds-editor"
version.workspace = true
edition.workspace = true
description = "SQL 编辑器：一个内核 + 三档能力（文本 / SQL / 分析）"

# 依赖方向（硬约束）：workbench → editor → engine / database / shared / gpui-kit。
# engine：SQL 文本原语（`sql::highlight` 词法区间 / `sql::split` 语句切分）。
[dependencies]
gpui-kit.workspace = true
engine.workspace = true
# 跨 crate 拖放载荷（`shared::InsertFileDrag`：拖起方在草稿箱，落点在本 crate 的编辑器面板）；
# 与 lib.rs 里「editor → engine / database / shared」的分层描述一致，且 shared 本就在传递依赖里。
shared.workspace = true
# 语义着色（A4）：trait 签名用到 lsp-types 与 anyhow（版本随 gpui-base，已在根 Cargo.toml 登记）
lsp-types.workspace = true
anyhow.workspace = true
# 编码/换行（2c）：磁盘字节 ↔ 内核 Unicode 的转码（版本随 reqwest 已在锁里，无新增编译）
encoding_rs.workspace = true
# 历史面板（B8）：引擎的历史记录带 `chrono::DateTime`（相对时间文案在 `history.rs`）
chrono.workspace = true
# 分析笔记（2d）：`.rdsnote` 落盘是 JSON（cell.rs / session.rs 的序列化形状）
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Jupyter 渲染分发（#14）：media.rs 消费 kernel 回传的 mime bundle（Media / MediaType）；
# image/* 的 data 是 base64 字符串，解码用 base64 crate
jupyter-protocol.workspace = true
base64.workspace = true
# Python 内核执行（#17）：KernelSession 真内核协议（依赖只向下——kernel 不依赖 editor / gpui）
rds-kernel.workspace = true
# 内核事件流是 tokio mpsc（shared.rs 的 KernelEntry；UI 线程用 try_recv 轮询）
tokio.workspace = true
# 执行链埋点（入口 / 前置闸拒绝 / 入队成败）：与 workbench 同一套 tracing 日志通道
tracing.workspace = true
# 共享纯数据模型（DocumentId / ExecChannel / ColumnAnnotation）：结果面板下沉后
# editor 与结果面板都从 shell 命名，避免「结果面板 → editor」反向依赖
workbench_shell.workspace = true
# 结果集面板（结果存储 / 变更集 / 导出随面板独立）：editor 依赖它、它不反向依赖 editor
result_panel.workspace = true
# 编辑器常规设置（#48）：行号开关即时生效 / 新文档默认缩进·换行·编码。
# settings 不依赖 editor（settings 依赖 workbench_shell/shared/paths），方向合法无环。
settings.workspace = true
# 文件元信息（Sidecar 快照）：书签持久化（`.filename.meta.json`），编辑器打开读 / 切换写回
file_meta.workspace = true

# 测试专用特性：`host.rs` 的 `commit_in_flight_for_test` 等测试辅助按
# `#[cfg(any(test, feature = "test-support"))]` 门控（与 paths crate 同口径）；
# 仅测试构建启用，生产构建（含 cargo run / release）拿不到它。
[features]
test-support = []

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }
