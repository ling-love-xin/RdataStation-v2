[package]
name = "rds-project"
version.workspace = true
edition.workspace = true
description = "M1 项目：名册 / .RSmeta 磁盘元数据 / 实例锁 / 选择器与设置视图"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `shared::` 引用直接生效
engine.workspace = true
shared.workspace = true
# 运行时数据路径唯一解析点（示例项目与系统库同层）
paths.workspace = true

# ===== UI（视图与 model/service 同 crate，见 GPUI-kit 编码指南）=====
gpui-kit.workspace = true
# 面板/控件尺寸常量与树行原语（ui.rs 引用；shell 不依赖任何特性 crate，方向安全）
workbench_shell.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 其他 =====
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
rusqlite.workspace = true
# 示例项目自带的 DuckDB 业务库必须用**当前内核版本**建（2.0 写出的库旧版读不了，
# 见 `service.rs::ensure_sample_data` 的说明）
duckdb.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }
