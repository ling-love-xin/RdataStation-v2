[package]
name = "rds-project"
version.workspace = true
edition.workspace = true
description = "M1 项目：双层数据架构（系统级共享 + 项目级物理隔离）、版本化"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `shared::` 引用直接生效
engine.workspace = true
shared.workspace = true
# 运行时数据路径唯一解析点（示例项目与系统库同层）
paths.workspace = true

# ===== UI（视图与 model/service 同 crate，见 GPUI-kit 编码指南）=====
gpui-kit.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 其他 =====
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
rusqlite.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# M1 双层架构装配验证（冒烟测试）
duckdb.workspace = true
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }
