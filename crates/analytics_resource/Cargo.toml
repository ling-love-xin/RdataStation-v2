[package]
name = "rds-analytics-resource"
version.workspace = true
edition.workspace = true
description = "M6 资产库 / 分析存档：归档 / 取回 / 版本（内容指纹）"

[dependencies]
engine.workspace = true
shared.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true

# ===== 视图（Feature 自持视图：资产库面板随能力同 crate，见 src/resource_view.rs）=====
gpui-kit.workspace = true

# ===== 内容指纹（本体 sha256）=====
sha2.workspace = true
hex.workspace = true

# ===== 其他 =====
tracing.workspace = true
rusqlite.workspace = true
uuid.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# 面板窗口测试（headless）需要 gpui 的 test-support 能力（下一批接窗口测试时启用）。
gpui-kit = { workspace = true, features = ["test-support"] }
