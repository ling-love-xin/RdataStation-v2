[package]
name = "rds-engine"
version.workspace = true
edition.workspace = true
description = "RdataStation v2 engine crate: 双引擎基础设施（DuckDB 分析引擎 + 驱动层 + DBI + 缓存 + 连接管理）"

[dependencies]
# 依赖键命名为 shared，使 v1 迁移代码中的 `shared::` 引用直接生效
shared.workspace = true
# 运行时数据路径唯一解析点（数据根 / 配置 / 日志 / 临时 / DuckDB 扩展）
paths.workspace = true
# 连接层已抽取为独立 crate（driver/factory 与 registry/config 引用它）
connection.workspace = true

# ===== 分析引擎 =====
duckdb.workspace = true
arrow.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true

# ===== 数据库驱动（native 实现） =====
sqlx.workspace = true
# 仅为在**后端 crate** 上开类型解码 features（`chrono` / `uuid` / `json`）：
# sqlx crate 的同名 feature 带 `sqlx-sqlite?/…` 弱引用，会把 sqlx-sqlite 拉进版本解析，
# 与 rusqlite 0.40 的 libsqlite3-sys 声明同一个 `links = "sqlite3"` 而冲突（交集为空）。
# 代码里**不使用**这两个 crate，只借 feature 合并；详见根 `Cargo.toml` 的注记。
sqlx-postgres.workspace = true
sqlx-mysql.workspace = true
rusqlite.workspace = true
mysql_async.workspace = true
tokio-postgres.workspace = true
postgres-native-tls.workspace = true

# ===== 连接层（SSL / SSH / Proxy） =====
native-tls.workspace = true
tokio-native-tls.workspace = true
russh.workspace = true
tokio-socks.workspace = true
base64.workspace = true
x509-parser.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 时间与项目 =====
chrono.workspace = true
uuid.workspace = true

# ===== 日志追踪 =====
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# ===== 工具库 =====
dashmap.workspace = true
once_cell.workspace = true
lru.workspace = true
rand.workspace = true
sqlglot-rust.workspace = true
percent-encoding.workspace = true
toml.workspace = true
regex.workspace = true
include_dir.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
