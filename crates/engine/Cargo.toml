[package]
name = "rds-engine"
version.workspace = true
edition.workspace = true
description = "RdataStation v2 engine crate: 双引擎基础设施（DuckDB 分析引擎 + 驱动层 + DBI + 缓存 + 连接管理）"

[dependencies]
# 依赖键命名为 shared，使 v1 迁移代码中的 `shared::` 引用直接生效
shared.workspace = true
# 运行时数据路径唯一解析点（数据根 / 配置 / 日志 / 临时 / DuckDB 扩展）
paths.workspace = true
# 连接层已抽取为独立 crate（driver/factory 与 registry/config 引用它）
connection.workspace = true
# SQL 语言服务（解析/切分/高亮/格式化/转译/语义/脚本词法），自本 crate 抽取（2026-10-29）。
# 键为 `rds-sql`（不是 `sql`）：本 crate 自有 `pub mod sql` 命名空间，避免同名遮蔽。
rds-sql.workspace = true
# 存储层（persistence/migration/logging 已迁出，本 crate 留命名空间薄壳）
rds-store.workspace = true
# 驱动层（driver 已迁出，本 crate 留命名空间薄壳）
rds-driver.workspace = true

# ===== 分析引擎 =====
duckdb.workspace = true
arrow.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true

# ===== 数据库驱动（native 实现） =====
# D3（2026-11-12）：sqlx 实现与 sqlx 依赖（含「只为后端 crate 合并 chrono/uuid/json
# features」的那三个）一起删除 —— 内核不再有 sqlx 代码路径，`cargo tree -p rds-engine`
# 里不该再出现 sqlx。量化验收见 `sqlx-driver-extraction-plan.md` §5/§7。
rusqlite.workspace = true
mysql_async.workspace = true
tokio-postgres.workspace = true
postgres-native-tls.workspace = true

# ===== 连接层（SSL / SSH / Proxy） =====
native-tls.workspace = true
tokio-native-tls.workspace = true
russh.workspace = true
tokio-socks.workspace = true
base64.workspace = true
x509-parser.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== 时间与项目 =====
chrono.workspace = true
uuid.workspace = true

# ===== 日志追踪 =====
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# ===== 工具库 =====
dashmap.workspace = true
once_cell.workspace = true
lru.workspace = true
rand.workspace = true
percent-encoding.workspace = true
toml.workspace = true
regex.workspace = true
include_dir.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
