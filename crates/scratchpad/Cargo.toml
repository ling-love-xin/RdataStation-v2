[package]
name = "rds-scratchpad"
version.workspace = true
edition.workspace = true
description = "M5 草稿箱：类 VS Code 文件管理的草稿工作区"

[dependencies]
shared.workspace = true
# 项目级回收站（`engine::persistence::trash`）：原来的 `src/trash.rs` 只有本模块一个使用方，
# M6 资产库也要用它，于是按 rds-architecture 的「≥ 2 使用方上提」规则搬到 engine 并中性化。
engine.workspace = true
# 统一标签能力（规格 §7.3：project tags + scratchpad_tags 关联；打标 / 读取 / 归档继承）。
tag.workspace = true
# 标签关联表 SQL（`scratchpad_tags` 与 `tags` 同库 JOIN / INSERT / DELETE）。
rusqlite.workspace = true
# 内容搜索独立 crate（用户点名 2026-10-10 抽取：后端模型 + 目录扫描 + 逐行匹配；
# 渲染面板第二阶段迁入，type_icon 由调用方注入）。
content_search.workspace = true
# per-file 连接元信息 sidecar（第③步：草稿箱连接元信息迁移，见 `store.rs` sidecar）。
file_meta.workspace = true
# ⋯ 更多设置持久化（2026-10-11 接线：工具栏显示/隐藏与左/右位置写入用户配置）。
settings.workspace = true

# ===== GPUI-kit 视图层 =====
# 草稿箱视图自带（下沉后本 crate 就是它的家）：要取 `cx.theme()`、要命名 `App`。
gpui-kit.workspace = true
# 工作台外壳：面板尺寸常量（`ui::*`）与视图共用纯数据。
workbench_shell.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true

# ===== 其他 =====
tracing.workspace = true
regex.workspace = true
similar.workspace = true
# 文件监控（外部改动 → 变更标记；见 src/watch.rs）
notify.workspace = true
opener.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# K10：面板层窗口级测试（`#[gpui_kit::test]` / `TestAppContext`，与 editor 同款先例）
gpui-kit = { workspace = true, features = ["test-support"] }
