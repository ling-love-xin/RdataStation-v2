[package]
name = "rds-mock"
version.workspace = true
edition.workspace = true
description = "M7 测试数据生成：基于元数据的 mock 数据（仅落 DuckDB 分析引擎）"

[dependencies]
engine.workspace = true
shared.workspace = true

# ===== 视图（Feature 自持视图：Mock 面板随能力同 crate，见 src/mock_view.rs） =====
gpui-kit.workspace = true
# 视图共用资产（结构尺寸单一来源）：行高 / 激活条等面板尺寸必须与外壳一致，
# 不再在本 crate 镜像一份。依赖方向 mock → workbench-shell（后者不得依赖任何特性 crate）。
workbench_shell.workspace = true

# ===== 数据生成 =====
fake.workspace = true
rand.workspace = true
# 生成历史的读写要进 tokio 运行时（项目库走 tokio::fs / tokio::sync，见 `history`）
tokio.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== DuckDB（分析引擎，mock 落临时表） =====
duckdb.workspace = true

# ===== 其他 =====
tracing.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
# 生成历史的记录 id（任务 / 列 / 模板）
uuid.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
# 集成测试（tests/）：`MockEngine` 公开 API 的异步端到端验证需要属性宏与多线程运行时
# （运行时的正式依赖在 [dependencies]，因为生成历史也要用）
# 面板窗口测试（headless）需要 gpui 的 test-support 能力
gpui-kit = { workspace = true, features = ["test-support"] }
