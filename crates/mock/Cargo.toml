[package]
name = "rds-mock"
version.workspace = true
edition.workspace = true
description = "M7 测试数据生成：基于元数据的 mock 数据（仅落 DuckDB 分析引擎）"

[dependencies]
engine.workspace = true
shared.workspace = true

# ===== 视图（Feature 自持视图：Mock 面板随能力同 crate，见 src/mock_view.rs） =====
gpui-kit.workspace = true

# ===== 数据生成 =====
fake.workspace = true
rand.workspace = true

# ===== 时间 =====
chrono.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true

# ===== DuckDB（分析引擎，mock 落临时表） =====
duckdb.workspace = true

# ===== 其他 =====
tracing.workspace = true
thiserror.workspace = true
rusqlite.workspace = true

[dev-dependencies]
# 集成测试（tests/）：`MockEngine` 公开 API 的异步端到端验证需要属性宏与多线程运行时
tokio.workspace = true
# 面板窗口测试（headless）需要 gpui 的 test-support 能力
gpui-kit = { workspace = true, features = ["test-support"] }
