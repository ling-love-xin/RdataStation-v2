[package]
name = "rds-settings"
version.workspace = true
edition.workspace = true
description = "RdataStation 设置：分节 model、JSON 持久化、设置面板视图（外观/通用/引擎/连接默认值）"

[dependencies]
gpui-kit.workspace = true
# 共用尺寸常量表（单一来源；本 crate 不得反向依赖特性 crate）
workbench_shell.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# 窗口级测试：headless 窗口需要 gpui 的 test-support（仅在测试构建启用）
gpui-kit = { workspace = true, features = ["test-support"] }
