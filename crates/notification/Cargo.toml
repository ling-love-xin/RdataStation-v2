[package]
name = "rds-notification"
version.workspace = true
edition = "2021"
description = "RdataStation 通知系统：全局通知推送、合并、历史记录、通知中心"
license = "MIT"

[lib]
doctest = false

[dependencies]
gpui-kit = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "unstable-locales"] }
tracing = "0.1"
uuid = { workspace = true }
settings = { workspace = true }
paths.workspace = true

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }
