[package]
name = "rds-notification"
version = "0.2.5"
edition = "2021"
description = "RdataStation 通知系统：全局通知推送、合并、历史记录、通知中心"
license = "MIT"

[lib]
doctest = false

[dependencies]
gpui-kit = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "unstable-locales"] }
tracing = "0.1"
uuid = { workspace = true }
settings = { workspace = true }
paths = { workspace = true }

[dev-dependencies]
# gpui-kit = { workspace = true, features = ["test-support"] }
