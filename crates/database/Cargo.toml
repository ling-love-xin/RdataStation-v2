[package]
name = "rds-database"
version.workspace = true
edition.workspace = true
description = "M4 数据库导航：元数据浏览器、对象属性面板"

[dependencies]
# 依赖键别名，使 v1 迁移代码中的 `engine::` / `shared::` 引用直接生效
engine = { path = "../engine", package = "rds-engine" }
shared = { path = "../shared", package = "rds-shared" }

# ===== Async 运行时 =====
tokio = { version = "1.44.1", features = ["full"] }

# ===== 序列化 =====
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.135"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "chrono"] }
