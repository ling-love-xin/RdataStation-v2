[package]
name = "rds-plugin"
version.workspace = true
edition.workspace = true
description = "M9 插件系统：Sidecar / WASM 运行时的数据库与分析插件支持"

[dependencies]
engine.workspace = true
shared.workspace = true
# 运行时数据路径唯一解析点（sidecar 的工作目录 / 日志 / 私有数据目录都从这里取）
paths.workspace = true

# ===== Async 运行时 =====
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true

# ===== 数据面（结果集走 Arrow，见 dev-plan §4.2.4 / §4.5） =====
arrow.workspace = true

# ===== 序列化 =====
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
# 反向 Host API 的 secret 一次性值走 base64（见 sidecar/host.rs）
base64.workspace = true

# ===== WASM 运行时（可选轨，默认关闭）=====
# wasm 轨已冻结为「可选性能轨」（docs/architecture/plugin/README.md Q10，2026-10-16 定案）：
# 宿主侧 render_document 尚未接线（随 D7 暂缓），实际发布插件走 sidecar 轨。
# extism 1.30 强绑定 wasmtime v43（非 optional，无 wasmi/wasm3 后端），单是它就为发布
# 二进制贡献约 20–40MB（估）。因此把 extism 做成 optional，由 `wasm` feature 启用；
# 默认构建（含 `cargo build/check/run` 与发布流水线的 `-p rds-app`）不再编译 wasmtime。
# 需要时：`cargo build -p rds-app --features rds-plugin/wasm`（或给依赖方统一开 feature）。
extism = { workspace = true, optional = true }

# ===== 其他 =====
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
toml.workspace = true

# ===== 插件包解压（installer：zip / tar.gz）=====
zip.workspace = true
tar.workspace = true
flate2.workspace = true

[features]
# 默认不启用 wasm 轨（wasmtime 不进编译图，见上方 extism 注释）；需要 wasm 插件时显式开启。
default = []
wasm = ["dep:extism"]

[dev-dependencies]
# 测试构建的数据根自动隔离（不写产品目录；见 data-paths.md §5）
paths = { workspace = true, features = ["test-support"] }

# 测试用 sidecar 靶子（真实进程边界上的端到端测试；见 tests/spawn_real_process.rs）。
# 放在 tests/ 下并显式声明路径：它**不是产品组件**，不该被当成要打包的二进制。
# 它故意不复用本 crate 的帧编解码 —— 两侧共一份实现，格式错得一致就测不出来。
[[bin]]
name = "rds-sidecar-fixture"
path = "tests/fixture/sidecar.rs"
