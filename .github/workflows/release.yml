name: Release

# 打标签即发布：云端编译（beta 阶段仅 Windows）→ 打包 → 上传到 Release Assets。
# 本地不打包、不上传（设计 / 流程 / 排错见 docs/architecture/release/release-pipeline.md）。
#
#   git tag RDS-beta-0.1.0 && git push origin RDS-beta-0.1.0   # beta：仅 Windows 包
#   git tag v0.1.0        && git push origin v0.1.0            # 定版：恢复全平台矩阵
#
# 手动跑（Actions → Release → Run workflow）只出工作流附件、**不建 Release**，用来试跑矩阵。
on:
  push:
    tags: ["v*", "RDS-beta-*"]
  workflow_dispatch:

# softprops/action-gh-release 要写 Release（建标签对应的 Release + 传 Assets）
permissions:
  contents: write

# 同一个 tag 重复推 / 手动试跑：不并发跑两遍（tag 事件本身很少重叠，这条是兜底）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 云端不复用 target/，增量编译只会拖慢并撑大磁盘
  CARGO_INCREMENTAL: "0"

jobs:
  # 发布前置校验：打标签后**先**把「标签与版本号对不上」「UI 契约红了」这类问题挡在
  # 编译之前。理由：release 构建是 240 分钟预算的重活，等它跑完四十分钟才发现版本号
  # 漂了，等于白烧一轮云端机时。`rds-ui-guard` 是纯源码扫描（1.5 秒级），不吃 GPUI。
  preflight:
    name: 发布前置校验
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # `.cargo/config.toml` 把 TEMP 钉到仓库内 `.rds/tmp`，全新检出里没有这个目录
      - name: 预建 TEMP 目录
        run: mkdir -p .rds/tmp

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: UI 契约守门
        run: cargo test -p rds-ui-guard

      # 版本漂移在发布路径上是**硬错误**，不是警告：产物按标签命名，名字和内容对不上
      # 会一路带到下载页（旧口径只发 warning，见 docs/architecture/release/release-pipeline.md §7）
      - name: 标签与版本号对账
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            RDS-beta-*) EXPECTED="RDS-beta-$CARGO_VERSION" ;;
            v*)         EXPECTED="v$CARGO_VERSION" ;;
            *)          echo "::error::标签格式不认识：$TAG（只认 v* 与 RDS-beta-*）"; exit 1 ;;
          esac
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::标签 $TAG 与 Cargo.toml 的版本 $CARGO_VERSION 不一致（应为 $EXPECTED）：先改版本号再打标签"
            exit 1
          fi

      # 发布说明缺失只警告、不拦：Release 正文会回落到 GitHub 自动生成，
      # 但手写说明是本仓的默认口径（docs/release/README.md），缺了要在日志里看得见
      - name: 发布说明存在性
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          NOTES="docs/release/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "发布说明：$NOTES"
          else
            echo "::warning::未找到 $NOTES，Release 正文将回落为 GitHub 自动生成（只有一个 compare 链接）"
          fi

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # 首次运行要编整个工作区（含 gpui 视图层与驱动栈）；`-j 2`（见下）下留足余量
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        # beta 阶段（RDS-beta-* 标签）只出 Windows 包；定版（v* 标签）时恢复全平台：
        #   Linux x86_64（ubuntu-22.04 + RPATH=$ORIGIN）
        #   macOS arm64 / x86_64（RPATH=@executable_path，包成 RdataStation.app）
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    env:
      # 只有 Linux / macOS 需要（Windows 由加载器按 exe 目录搜索）
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # `.cargo/config.toml` 把 `TEMP`/`TMP`/`TMPDIR` 钉到仓库内 `.rds/tmp`，而全新检出里没有
      # 这个目录：MSVC 的 link.exe 写不了 `lnk{GUID}.tmp` → LNK1104（**发版构建要链接**，
      # 必须建；CI 工作流同样一步，理由见 docs/architecture/release/release-pipeline.md §7）。
      - name: 预建 TEMP 目录
        shell: bash
        run: mkdir -p .rds/tmp

      # 发布说明：本仓手写 `docs/release/notes/<标签名>.md`（口径见 docs/release/README.md）。
      # 有就整篇用它，没有才回落到 GitHub 自动生成——自动生成只汇总 PR 与 issue，
      # 单人直推的仓库拿到的正文只有一个 `**Full Changelog**` 链接。
      - name: 解析发布说明
        id: notes
        shell: bash
        run: |
          NOTES="docs/release/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "发布说明：$NOTES"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未找到 $NOTES，回落为 GitHub 自动生成"
          fi

      # 系统依赖清单是**一份**（`tools/install-linux-deps.sh`，CI 工作流共用同一份）：
      # gpui 的 Linux 后端要 wayland / xkbcommon / xcb / fontconfig，bindgen 要 libclang，
      # native-tls 要 OpenSSL；缺了会在编译期报找不到头文件或 -lxxx。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: bash tools/install-linux-deps.sh

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 只缓存依赖下载（registry / git），**不缓存 target/**：本工作区一份 target/ 就有数 GB，
      # 会挤爆仓库的 10 GB 缓存预算，上传时间也比省下的编译时间还长。
      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false

      # 仓库里的脚本都是 644（用 `bash` 显式调用，Windows 的 Git-Bash 不认 shebang 执行位）
      - name: 取 DuckDB 预编译内核
        shell: bash
        env:
          GH_PROXY: "" # runner 能直连 GitHub，不走镜像；版本与 crate 成对，见 Cargo.toml 注
        run: bash tools/fetch-duckdb.sh

      - name: 解析版本号
        id: meta
        shell: bash
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              RDS-beta-*) VERSION="${TAG#RDS-beta-}" ;;   # beta 标签：RDS-beta-<版本号>
              v*)         VERSION="${TAG#v}" ;;           # 定版标签：v<版本号>
              *)          VERSION="$TAG" ;;
            esac
            if [ "$TAG" != "RDS-beta-$CARGO_VERSION" ] && [ "$TAG" != "v$CARGO_VERSION" ]; then
              echo "::error::标签 $TAG 与 Cargo.toml 的版本 $CARGO_VERSION 不一致（preflight 应已拦下，这里是兜底）"
              exit 1
            fi
          else
            # 手动试跑：没有标签，用 Cargo.toml 的版本
            VERSION="$CARGO_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION"

      # `-j 2`：多个 rustc 同时链接重型 crate 会吃满内存（与 README / config.toml 同口径）
      - name: 构建 rds-app（release）
        run: cargo build --release --locked -p rds-app -j 2 --target ${{ matrix.target }}

      # 把 RPATH 与 DuckDB 依赖打进日志：发布包「库没找到」这类问题一眼可查
      - name: 打印链接信息（排错用）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/rds-app"
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$BIN" | grep -i duckdb || true
            otool -l "$BIN" | grep -A2 LC_RPATH || true
          else
            readelf -d "$BIN" | grep -Ei 'rpath|runpath|duckdb' || true
          fi

      - name: 打包（可分发目录 + 归档 + 校验和）
        shell: bash
        run: bash tools/package-release.sh "${{ steps.meta.outputs.version }}" "${{ matrix.target }}"

      - name: 上传工作流附件
        uses: actions/upload-artifact@v4
        with:
          name: rds-app-${{ steps.meta.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      # 矩阵各跑各的、各自上传：action 第一次跑建 Release，其余追加 Assets。
      # 正文优先用手写的 notes 文件；beta 标签标成 prerelease，免得抢走 Latest。
      - name: 上传到 Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.has != 'true' }}
          prerelease: ${{ startsWith(github.ref_name, 'RDS-beta-') }}
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
