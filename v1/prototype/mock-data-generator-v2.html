<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock 数据生成器 v2 — RdataStation 原型</title>
    <style>
      :root {
        --bg-body: #1e1e1e;
        --bg-sidebar: #252526;
        --bg-panel: #2d2d30;
        --bg-input: #3c3c3c;
        --bg-input-focus: #4a4a4d;
        --bg-hover: #3a3a3a;
        --bg-active: #094771;
        --bg-card: #2d2d30;
        --bg-badge: #4a4a4d;
        --bg-progress: #3c3c3c;
        --bg-table-header: #2d2d30;
        --bg-table-even: #252526;
        --bg-table-odd: #1e1e1e;
        --bg-modal-overlay: rgba(0, 0, 0, 0.55);
        --bg-drawer: #252526;
        --bg-tag: #3a3d41;
        --bg-tag-success: #1a3a2a;
        --bg-tag-warning: #3a3a1a;
        --border: #3c3c3c;
        --border-subtle: #333;
        --fg: #cccccc;
        --fg-bright: #e0e0e0;
        --fg-dim: #858585;
        --fg-accent: #4fc1ff;
        --fg-accent-hover: #6bc5ff;
        --fg-number: #b5cea8;
        --fg-string: #ce9178;
        --fg-keyword: #569cd6;
        --fg-function: #dcdcaa;
        --fg-boolean: #569cd6;
        --fg-null: #808080;
        --fg-success: #4ec9b0;
        --fg-warning: #cca700;
        --fg-error: #f44747;
        --brand-accent: #0078d4;
        --brand-accent-soft: rgba(0, 120, 212, 0.15);
        --green: #4ec9b0;
        --purple: #c586c0;
        --orange: #ce9178;
        --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
        --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
        --radius: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 12px;
        --spacing-lg: 16px;
        --spacing-xl: 24px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg-body);
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 13px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ===== Titlebar ===== */
      .titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 30px;
        padding: 0 10px;
        flex-shrink: 0;
        background: #323233;
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
      }
      .titlebar .app {
        font-size: 12px;
        color: var(--fg);
        font-weight: 500;
      }
      .titlebar .sep {
        width: 1px;
        height: 14px;
        background: var(--border);
      }
      .titlebar .dim {
        font-size: 11px;
        color: var(--fg-dim);
      }

      /* ===== Scrollbar ===== */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #777;
      }

      /* ===== Buttons ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border: none;
        border-radius: var(--radius);
        font-size: 12px;
        font-family: var(--font-ui);
        cursor: pointer;
        color: var(--fg);
        background: var(--bg-input);
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--bg-hover);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-sm {
        padding: 2px 6px;
        font-size: 11px;
      }
      .btn-xs {
        padding: 1px 4px;
        font-size: 10px;
      }
      .btn-icon {
        background: transparent;
        padding: 4px;
        border-radius: var(--radius);
      }
      .btn-icon:hover {
        background: var(--bg-hover);
      }
      .btn-primary {
        background: var(--brand-accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: #1a8ad4;
      }
      .btn-danger {
        color: var(--fg-error);
      }
      .btn-danger:hover {
        background: rgba(244, 71, 71, 0.15);
      }
      .btn-ghost {
        background: transparent;
      }
      .btn-ghost:hover {
        background: var(--bg-hover);
      }

      /* ===== Inputs ===== */
      input,
      select {
        background: var(--bg-input);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 4px 8px;
        font-size: 12px;
        font-family: var(--font-ui);
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus,
      select:focus {
        border-color: var(--brand-accent);
        background: var(--bg-input-focus);
      }
      input[type='number'] {
        width: 80px;
      }
      input.sm {
        padding: 2px 6px;
        font-size: 11px;
      }

      /* ===== Main Layout ===== */
      .main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* ===== Panel ===== */
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-body);
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-xs) var(--spacing-md);
        border-bottom: 1px solid var(--border);
        min-height: 36px;
        flex-shrink: 0;
      }
      .panel-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--fg-bright);
      }
      .panel-header-actions {
        display: flex;
        gap: 2px;
      }

      .panel-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: var(--spacing-sm) var(--spacing-md);
        gap: var(--spacing-sm);
      }

      /* ===== Config Section ===== */
      .config-section {
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--bg-panel);
        border-radius: var(--radius-md);
        border: 1px solid var(--border-subtle);
      }
      .config-row {
        display: flex;
        gap: var(--spacing-sm);
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .config-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .config-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* ===== Columns Section ===== */
      .columns-section {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg-panel);
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-xs) var(--spacing-sm);
        background: var(--bg-sidebar);
        border-bottom: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }
      .section-title {
        font-size: 10px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .columns-list {
        padding: var(--spacing-xs) var(--spacing-sm);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
        overflow-y: auto;
        max-height: 260px;
      }
      .column-row {
        display: flex;
        gap: var(--spacing-xs);
        align-items: center;
      }
      .column-row input.col-name {
        width: 110px;
        flex-shrink: 0;
      }
      .column-row select.col-type {
        width: 100px;
        flex-shrink: 0;
      }
      .column-row input.col-dt-param {
        width: 56px;
        flex-shrink: 0;
      }
      .column-row select.col-gen {
        flex: 1;
        min-width: 120px;
      }
      .column-row input.col-null {
        width: 64px;
        flex-shrink: 0;
      }
      .col-action-btn {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: var(--radius);
        background: transparent;
        border: none;
        color: var(--fg-dim);
        font-size: 13px;
        transition: all 0.15s;
      }
      .col-action-btn:hover {
        background: var(--bg-hover);
        color: var(--fg);
      }
      .col-action-btn.danger:hover {
        color: var(--fg-error);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.5px;
        background: var(--bg-tag);
        color: var(--fg-accent);
      }
      .tag .tag-close {
        cursor: pointer;
        margin-left: 2px;
        font-size: 11px;
        opacity: 0.6;
      }
      .tag .tag-close:hover {
        opacity: 1;
      }

      /* ===== Generate Section ===== */
      .generate-section {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-xs) 0;
        flex-shrink: 0;
      }
      .generate-info {
        font-size: 12px;
        color: var(--fg-dim);
      }
      .progress-bar-wrap {
        flex: 1;
        height: 4px;
        background: var(--bg-progress);
        border-radius: 2px;
        overflow: hidden;
        max-width: 200px;
      }
      .progress-bar-fill {
        height: 100%;
        background: var(--brand-accent);
        border-radius: 2px;
        transition: width 0.3s;
      }

      /* ===== Preview Section ===== */
      .preview-section {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg-panel);
      }
      .preview-actions {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }
      .preview-table-wrap {
        overflow: auto;
        max-height: 320px;
      }
      table.data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        font-family: var(--font-mono);
      }
      table.data-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--bg-table-header);
        color: var(--fg-keyword);
        padding: 6px 10px;
        text-align: left;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        font-size: 11px;
      }
      table.data-table td {
        padding: 4px 10px;
        border-bottom: 1px solid var(--border-subtle);
        white-space: nowrap;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      table.data-table tr:nth-child(even) td {
        background: var(--bg-table-even);
      }
      table.data-table tr:hover td {
        background: var(--bg-hover);
      }

      /* ===== History Section ===== */
      .history-section {
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        background: var(--bg-panel);
      }
      .history-list {
        padding: var(--spacing-xs) var(--spacing-sm);
        max-height: 140px;
        overflow-y: auto;
      }
      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--spacing-xs);
        cursor: pointer;
        border-radius: var(--radius);
        transition: background 0.15s;
      }
      .history-item:hover {
        background: var(--bg-hover);
      }
      .history-item-left {
        display: flex;
        gap: var(--spacing-sm);
        align-items: center;
        font-size: 12px;
      }
      .history-item-left .h-table {
        color: var(--fg-bright);
        font-weight: 500;
      }
      .history-item-left .h-rows {
        color: var(--fg-dim);
      }
      .history-item-left .h-status {
        color: var(--fg-success);
        font-size: 10px;
      }
      .history-item-right {
        font-size: 11px;
        color: var(--fg-dim);
        display: flex;
        gap: 4px;
        align-items: center;
      }

      /* ===== Modal ===== */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg-modal-overlay);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        min-width: 400px;
        max-width: 700px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .modal-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--fg-bright);
      }
      .modal-body {
        overflow-y: auto;
        flex: 1;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: var(--spacing-sm);
        padding-top: var(--spacing-sm);
        border-top: 1px solid var(--border);
      }

      /* ===== Template Cards ===== */
      .template-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--spacing-sm);
      }
      .template-card {
        padding: var(--spacing-md);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all 0.15s;
        background: var(--bg-sidebar);
      }
      .template-card:hover {
        border-color: var(--brand-accent);
      }
      .template-card.selected {
        border-color: var(--brand-accent);
        box-shadow: 0 0 0 2px var(--brand-accent-soft);
      }
      .template-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .template-card-name {
        font-size: 14px;
        font-weight: 600;
      }
      .template-card-category {
        font-size: 10px;
        color: var(--brand-accent);
        background: var(--brand-accent-soft);
        padding: 1px 6px;
        border-radius: 3px;
      }
      .template-card-desc {
        font-size: 12px;
        color: var(--fg-dim);
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .template-card-meta {
        display: flex;
        gap: var(--spacing-sm);
        font-size: 11px;
        color: var(--fg-dim);
      }

      /* ===== Drawer ===== */
      .drawer-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg-modal-overlay);
        z-index: 200;
      }
      .drawer-overlay.open {
        display: flex;
        justify-content: flex-end;
      }
      .drawer {
        width: 420px;
        height: 100%;
        background: var(--bg-drawer);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.3);
      }
      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-md);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .drawer-title {
        font-size: 14px;
        font-weight: 600;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-md);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
      }
      .drawer-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--spacing-md);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }
      .drawer-footer-right {
        display: flex;
        gap: var(--spacing-sm);
      }

      /* ===== Filter Tabs ===== */
      .filter-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-xs);
      }
      .filter-tab {
        padding: 2px 8px;
        border-radius: 3px;
        font-size: 11px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg-input);
        color: var(--fg-dim);
        transition: all 0.15s;
      }
      .filter-tab:hover {
        color: var(--fg);
      }
      .filter-tab.active {
        background: var(--brand-accent-soft);
        color: var(--brand-accent);
        border-color: var(--brand-accent);
      }

      /* ===== Generator List ===== */
      .generator-list {
        max-height: 240px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-sidebar);
      }
      .gen-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 12px;
        transition: background 0.15s;
      }
      .gen-item:last-child {
        border-bottom: none;
      }
      .gen-item:hover {
        background: var(--bg-hover);
      }
      .gen-item.selected {
        background: var(--brand-accent-soft);
        border-left: 2px solid var(--brand-accent);
      }
      .gen-item-left {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .gen-item-name {
        font-weight: 500;
      }
      .gen-item-type {
        font-size: 10px;
        color: var(--fg-dim);
        font-family: var(--font-mono);
      }
      .gen-item-example {
        font-size: 11px;
        color: var(--fg-dim);
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gen-recommend {
        font-size: 10px;
        color: var(--fg-success);
      }
      .gen-empty {
        padding: 20px;
        text-align: center;
        color: var(--fg-dim);
        font-size: 12px;
      }

      /* ===== Param Fields ===== */
      .param-group {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
      }
      .param-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .param-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-dim);
      }

      /* ===== Form ===== */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
      }
      .form-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--fg-dim);
      }

      /* ===== Toggle Switch ===== */
      .toggle-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--fg-dim);
      }
      .toggle {
        width: 32px;
        height: 18px;
        background: var(--bg-input);
        border-radius: 9px;
        cursor: pointer;
        position: relative;
        transition: background 0.2s;
        border: 1px solid var(--border);
      }
      .toggle.on {
        background: var(--brand-accent);
        border-color: var(--brand-accent);
      }
      .toggle::after {
        content: '';
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        position: absolute;
        top: 1px;
        left: 1px;
        transition: left 0.2s;
      }
      .toggle.on::after {
        left: 15px;
      }

      /* ===== Empty State ===== */
      .empty-state {
        text-align: center;
        padding: var(--spacing-xl) 0;
        color: var(--fg-dim);
        font-size: 13px;
      }

      /* ===== Source Info ===== */
      .source-info {
        margin-top: 4px;
        font-size: 10px;
        color: var(--fg-dim);
        text-align: right;
      }

      /* ===== Icons (inline SVG) ===== */
      .icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .icon-sm {
        width: 12px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <!-- ===== Titlebar ===== -->
    <div class="titlebar">
      <span class="app">RdataStation</span>
      <span class="sep"></span>
      <span>Mock 数据生成器</span>
      <span class="dim">v0.5 — 原型</span>
    </div>

    <!-- ===== Main ===== -->
    <div class="main">
      <div class="panel">
        <!-- Header -->
        <div class="panel-header">
          <span class="panel-title">Mock 数据生成器</span>
          <div class="panel-header-actions">
            <button class="btn btn-sm btn-ghost" onclick="openTemplateDialog()" title="场景模板"
              >📋 模板</button
            >
            <button class="btn btn-sm btn-ghost" onclick="openImportDialog()" title="导入数据库结构"
              >📥 导入</button
            >
            <button class="btn btn-sm btn-ghost" onclick="loadHistory()" title="生成历史"
              >🕐 历史</button
            >
            <button class="btn btn-sm btn-ghost" onclick="openSaveTemplateModal()" title="保存模板"
              >💾 保存模板</button
            >
          </div>
        </div>

        <!-- Body -->
        <div class="panel-body">
          <!-- Config -->
          <div class="config-section">
            <div class="config-row">
              <div class="config-item">
                <label class="config-label">表名</label>
                <input
                  type="text"
                  id="tableName"
                  value="mock_users"
                  placeholder="table_name"
                  style="width: 140px"
                />
              </div>
              <div class="config-item">
                <label class="config-label">行数</label>
                <input
                  type="number"
                  id="rowCount"
                  value="100"
                  min="1"
                  max="1000000"
                  style="width: 90px"
                />
              </div>
              <div class="config-item">
                <label class="config-label">种子</label>
                <input
                  type="text"
                  id="seedInput"
                  placeholder="可选"
                  style="width: 80px"
                  oninput="onSeedInput(this.value)"
                />
              </div>
              <div class="config-item">
                <label class="config-label">地区</label>
                <select id="localeSelect" style="width: 140px">
                  <option value="ZH_CN">🇨🇳</option></select
                ></div
              ></div
            ></div
          ></div
        ></div
      ></div
    ></body
  ></html
