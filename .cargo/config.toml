# 项目级 Cargo 配置
#
# 边界说明（重要，避免把它当成"依赖管理"入口）：
#   - 本文件**不管**「用哪个依赖版本」：版本由根 Cargo.toml 的 [workspace.dependencies]
#     声明、由 Cargo.lock 锁定，见 docs/architecture/dependencies/dependency-strategy.md
#   - 本文件**管**「怎么构建 / 从哪取包 / 命令别名」：[alias] / [build] / [net] / [env] /
#     [source] / [target.*]
#   - 不要写 [profile.*]：Cargo 1.57 起 profile 只认根 Cargo.toml，写在配置里会被忽略
#     （v1/backend/.cargo/config.toml 里的 [profile.dev] 就是这样失效的）
#   - 不要把 crates.io 镜像写进本文件：镜像属于机器级配置（本机在 CARGO_HOME 的
#     config.toml 里指向 tuna），写进仓库会强制影响其他网络环境与 CI

[alias]
# 根 Cargo.toml 设了 default-members = ["crates/app"]，
# 裸 `cargo check` / `cargo test` 只覆盖 app 依赖图（跳过 plugin → wasmtime）
check-all = "check --workspace --all-targets"
# -j 2：workspace 全量编译时多个 rustc 同时链接会耗尽内存（历史上最重的是 DuckDB
# 静态库，现已改动态链接，见 docs/architecture/dependencies/duckdb-linking.md）；
# 保留 -j 2 是因为其余重型 crate 的 codegen / 链接仍会吃满内存与宿主资源。
test-all = "test --workspace -j 2"
clippy-all = "clippy --workspace --all-targets"

[env]
# edition 2024 下，视图层深链式 builder（gpui-kit 元素树）在 codegen 阶段的
# monomorphization 递归更深；rustc 工作线程默认 8 MiB 栈会以
# STATUS_STACK_BUFFER_OVERRUN（0xc0000409）中断编译——表现为 `cargo check` 正常、
# `cargo test` / `cargo build` 崩溃。抬高 cargo 派生的 rustc 线程栈即可稳定通过。
RUST_MIN_STACK = "268435456"

# DuckDB 内核：**动态链接**仓库内的预编译库（设计 / 升级 / 排错见
# docs/architecture/dependencies/duckdb-linking.md）。
#   - 目录相对本文件（`relative = true`）：开发机不需要设任何环境变量；
#   - 库不在位时 `crates/engine/build.rs` 会给出一条可执行的提示；
#   - 不开 `force`：换版本 / 换机器时可用自己的 DUCKDB_LIB_DIR 覆盖。
DUCKDB_LIB_DIR = { value = "third_party/duckdb/1.5.5", relative = true }

# 运行时数据根（设计见 docs/architecture/runtime/data-paths.md）：
# 发布版默认落在**可执行文件所在目录**（安装目录）；但开发时那是 `target/debug`，
# 一次 `cargo clean` 就把 global.db / 密钥库 / 设置全清掉。这里把它钉到仓库根的
# `.rds/`（已在忽略规则里，不入库）。
#   - 不开 `force`：命令行里显式 `RDS_HOME=<某处> cargo run` 仍然优先。
RDS_HOME = { value = ".rds", relative = true }
